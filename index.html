<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  // 取得いただいたFirebase接続設定を直接設定
  const firebaseConfig = {
    apiKey: "AIzaSyAHY5FtpLE8FCI0fr9oJpOAILoQRIs6Tv4",
    authDomain: "bootcamp-a4d13.firebaseapp.com",
    projectId: "bootcamp-a4d13",
    storageBucket: "bootcamp-a4d13.firebasestorage.app",
    messagingSenderId: "731592880059",
    appId: "1:731592880059:web:7b80153979771c1dbd1e9e"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const initAuth = async () => {
      try {
        await signInAnonymously(auth);
        window.__FIREBASE_ACTIVE = true;
        window.__FIREBASE_DB = db;
        window.dispatchEvent(new CustomEvent('firebase-ready'));
      } catch (e) {
        console.warn("Auth initialization error:", e);
        window.dispatchEvent(new CustomEvent('firebase-offline'));
      }
    };
    initAuth();
  } catch (err) {
    console.warn("Firebase setup notice:", err);
    window.dispatchEvent(new CustomEvent('firebase-offline'));
  }
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// --- ラスベガス 上位過半数配当テーブル ---
const VEGAS_PAYOUT_TABLE = {
  2:  [2],
  3:  [3, 1],
  4:  [3, 1],
  5:  [3, 2, 1],
  6:  [3, 2, 1],
  7:  [4, 3, 2, 1],
  8:  [4, 3, 2, 1],
  9:  [5, 4, 3, 2, 1],
  10: [5, 4, 3, 2, 1]
};

// 初期プレイヤー20名（名前は空欄）
const DEFAULT_PLAYERS = Array.from({ length: 20 }, (_, i) => ({
  id: `p${i + 1}`,
  name: '',
  hdcpVal: 0,
  hdcpScope: 'NONE',
  isGhost: false
}));

const DEFAULT_PAR3_HOLES = [3, 7, 12, 17];
const DEFAULT_PAR5_HOLES = [2, 8, 13, 18];

function App() {
  // 初期表示: URLに ?mode=player がある場合のみプレイヤー画面、通常アクセスはすべて幹事画面
  const [viewMode, setViewMode] = useState(() => {
    const params = new URLSearchParams(window.location.search);
    return params.get('mode') === 'player' ? 'player' : 'admin';
  });

  // コンペ識別キー
  const [compId, setCompId] = useState(() => {
    const params = new URLSearchParams(window.location.search);
    return params.get('comp') || 'comp_main_2026';
  });

  // コンペ名
  const [compName, setCompName] = useState(() => {
    return localStorage.getItem(`golf_comp_name_${compId}`) || '第1回 親睦ゴルフコンペ';
  });

  // コンペ履歴リスト [{id, name, date}]
  const [compHistory, setCompHistory] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('golf_comp_history_list') || '[]');
    } catch {
      return [];
    }
  });

  const [mainTab, setMainTab] = useState('input');
  const [rankingSubTab, setRankingSubTab] = useState('vegas');
  const [selectedIndividualPlayerId, setSelectedIndividualPlayerId] = useState('p1');
  const [syncStatus, setSyncStatus] = useState('local');

  const [sortField, setSortField] = useState('finalP');
  const [sortAsc, setSortAsc] = useState(false);

  // コンペ設定＆スコア State（初期値はlocalStorageから優先復元）
  const [playerCount, setPlayerCount] = useState(() => {
    const local = localStorage.getItem(`golf_data_${compId}`);
    if (local) {
      try { return JSON.parse(local).playerCount || 4; } catch(e){}
    }
    return 4;
  });

  const [players, setPlayers] = useState(() => {
    const local = localStorage.getItem(`golf_data_${compId}`);
    if (local) {
      try { return JSON.parse(local).players || DEFAULT_PLAYERS; } catch(e){}
    }
    return DEFAULT_PLAYERS;
  });

  const [par3Holes, setPar3Holes] = useState(() => {
    const local = localStorage.getItem(`golf_data_${compId}`);
    if (local) {
      try { return JSON.parse(local).par3Holes || DEFAULT_PAR3_HOLES; } catch(e){}
    }
    return DEFAULT_PAR3_HOLES;
  });

  const [par5Holes, setPar5Holes] = useState(() => {
    const local = localStorage.getItem(`golf_data_${compId}`);
    if (local) {
      try { return JSON.parse(local).par5Holes || DEFAULT_PAR5_HOLES; } catch(e){}
    }
    return DEFAULT_PAR5_HOLES;
  });

  const [currentHole, setCurrentHole] = useState(1);
  const [titleWinners, setTitleWinners] = useState(() => {
    const local = localStorage.getItem(`golf_data_${compId}`);
    if (local) {
      try { return JSON.parse(local).titleWinners || {}; } catch(e){}
    }
    return {};
  });

  const [scores, setScores] = useState(() => {
    const local = localStorage.getItem(`golf_data_${compId}`);
    if (local) {
      try { return JSON.parse(local).scores || {}; } catch(e){}
    }
    const init = {};
    for (let h = 1; h <= 18; h++) init[h] = {};
    return init;
  });

  const [h1RandomOrder, setH1RandomOrder] = useState([]);

  // モーダル・トースト
  const [showRuleModal, setShowRuleModal] = useState(false);
  const [ruleModalTab, setRuleModalTab] = useState(1);
  const [showShareModal, setShowShareModal] = useState(false);
  const [showResetModal, setShowResetModal] = useState(false);
  const [showNewCompModal, setShowNewCompModal] = useState(false);
  const [newCompNameInput, setNewCompNameInput] = useState('');
  const [toastMessage, setToastMessage] = useState(null);

  const isRemoteUpdatingRef = useRef(false);

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3000);
  };

  // 履歴リストの更新とローカル保存
  const saveToHistory = (id, name) => {
    setCompHistory(prev => {
      const filtered = prev.filter(item => item.id !== id);
      const d = new Date();
      const dateStr = `${d.getFullYear()}/${('0'+(d.getMonth()+1)).slice(-2)}/${('0'+d.getDate()).slice(-2)}`;
      const updated = [{ id, name: name || '名称未設定コンペ', date: dateStr }, ...filtered];
      localStorage.setItem('golf_comp_history_list', JSON.stringify(updated));
      return updated;
    });
  };

  // ホール構成（Par3とPar5の各4ホールから自動生成、残りはPar4）
  const holeConfig = useMemo(() => {
    return Array.from({ length: 18 }, (_, i) => {
      const hNum = i + 1;
      let par = 4;
      let titleType = null;

      if (par3Holes.includes(hNum)) {
        par = 3;
        titleType = 'NEARPIN';
      } else if (par5Holes.includes(hNum)) {
        par = 5;
        titleType = 'DRACON';
      }

      return {
        hole: hNum,
        par: par,
        titleType: titleType
      };
    });
  }, [par3Holes, par5Holes]);

  // --- Firebase Firestore リアルタイム同期 ---
  useEffect(() => {
    let unsubscribe = null;

    const setupSync = () => {
      if (!window.__FIREBASE_ACTIVE || !window.__FIREBASE_DB) {
        setSyncStatus('local');
        return;
      }
      const db = window.__FIREBASE_DB;
      
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((fLib) => {
        const ref = fLib.doc(db, 'golf_comps', compId);
        unsubscribe = fLib.onSnapshot(ref, (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            isRemoteUpdatingRef.current = true;
            if (data.compName) setCompName(data.compName);
            if (data.playerCount !== undefined) setPlayerCount(data.playerCount);
            if (data.players) setPlayers(data.players);
            if (data.par3Holes) setPar3Holes(data.par3Holes);
            if (data.par5Holes) setPar5Holes(data.par5Holes);
            if (data.titleWinners) setTitleWinners(data.titleWinners);
            if (data.scores) setScores(data.scores);
            if (data.h1RandomOrder) setH1RandomOrder(data.h1RandomOrder);
            setTimeout(() => { isRemoteUpdatingRef.current = false; }, 150);
            setSyncStatus('synced');
            if (data.compName) saveToHistory(compId, data.compName);
          } else {
            saveData(false);
          }
        }, (err) => {
          console.warn("Firestore onSnapshot error:", err);
          setSyncStatus('error');
        });
      });
    };

    window.addEventListener('firebase-ready', setupSync);
    window.addEventListener('firebase-offline', () => setSyncStatus('local'));

    if (window.__FIREBASE_ACTIVE) {
      setupSync();
    }

    return () => {
      if (unsubscribe) unsubscribe();
      window.removeEventListener('firebase-ready', setupSync);
    };
  }, [compId]);

  // クラウド保存＆ローカル二重保存（更新しても絶対消えない処理）
  const saveData = async (isManualChange = true) => {
    // 1. ローカルストレージへ即時保存（オフライン・更新耐性）
    const payload = {
      compName,
      playerCount,
      players,
      par3Holes,
      par5Holes,
      titleWinners,
      scores,
      h1RandomOrder,
      updatedAt: Date.now()
    };
    localStorage.setItem(`golf_data_${compId}`, JSON.stringify(payload));
    localStorage.setItem(`golf_comp_name_${compId}`, compName);
    saveToHistory(compId, compName);

    // 2. クラウド同期
    if (!window.__FIREBASE_ACTIVE || !window.__FIREBASE_DB) {
      setSyncStatus('local');
      return;
    }
    if (isRemoteUpdatingRef.current) return;

    setSyncStatus('syncing');
    try {
      const fLib = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
      const db = window.__FIREBASE_DB;
      const docRef = fLib.doc(db, 'golf_comps', compId);
      
      await fLib.setDoc(docRef, payload, { merge: true });
      setSyncStatus('synced');
    } catch (err) {
      console.warn("Save error:", err);
      setSyncStatus('error');
    }
  };

  useEffect(() => {
    if (isRemoteUpdatingRef.current) return;
    const timer = setTimeout(() => {
      saveData(true);
    }, 400);
    return () => clearTimeout(timer);
  }, [compName, playerCount, players, par3Holes, par5Holes, titleWinners, scores, h1RandomOrder]);

  const activePlayers = useMemo(() => {
    const raw = players.slice(0, playerCount).map((p, idx) => ({
      ...p,
      name: p.name.trim() || `プレイヤー ${idx + 1}`,
      isGhost: false
    }));
    if (playerCount % 2 !== 0) {
      raw.push({
        id: 'ghost_dummy',
        name: '👻 ゴースト (欠席枠)',
        hdcpVal: 0,
        hdcpScope: 'NONE',
        isGhost: true
      });
    }
    return raw;
  }, [players, playerCount]);

  useEffect(() => {
    const ids = activePlayers.map(p => p.id);
    if (h1RandomOrder.length !== ids.length || !h1RandomOrder.every(id => ids.includes(id))) {
      const shuffled = [...ids].sort(() => Math.random() - 0.5);
      setH1RandomOrder(shuffled);
    }
  }, [activePlayers]);

  const isHdcpApplicable = (scope, par) => {
    if (scope === 'ALL') return true;
    if (scope === 'PAR4_5') return par === 4 || par === 5;
    if (scope === 'PAR4') return par === 4;
    return false;
  };

  const getPlayerScoreData = (holeNum, player) => {
    const par = holeConfig[holeNum - 1].par;
    if (player.isGhost) {
      return {
        gross: par + 1,
        net: par + 1,
        putts: 2,
        chipIn: false,
        onePat: false,
        threePat: false,
        saoIchi: false,
        sunaIchi: false,
        ob: false,
        water: false,
        bunker: false,
        isCompleted: true
      };
    }

    const holeScore = scores[holeNum]?.[player.id];
    const gross = holeScore?.gross !== undefined ? holeScore.gross : par;
    const putts = holeScore?.putts !== undefined ? holeScore.putts : 2;

    const applicable = isHdcpApplicable(player.hdcpScope, par);
    const net = applicable ? gross + player.hdcpVal : gross;

    const chipIn = putts === 0;
    const onePat = putts === 1;
    const threePat = putts >= 3;

    return {
      gross,
      net,
      putts,
      chipIn,
      onePat,
      threePat,
      saoIchi: holeScore?.saoIchi || false,
      sunaIchi: holeScore?.sunaIchi || false,
      ob: holeScore?.ob || false,
      water: holeScore?.water || false,
      bunker: holeScore?.bunker || false,
      isCompleted: holeScore?.isCompleted || false
    };
  };

  const calculateHolePoints = (holeNum, player) => {
    if (player.isGhost) {
      return {
        scoreP: 0,
        bonusP: 0,
        penP: 0,
        autoBonusP: 0,
        totalP: 0,
        bonusCount: 0,
        penCount: 0,
        isBounceBack: false,
        isObPar: false,
        breakdown: []
      };
    }

    const par = holeConfig[holeNum - 1].par;
    const d = getPlayerScoreData(holeNum, player);
    const breakdown = [];

    const diff = d.net - par;
    let scoreP = 0;
    if (diff <= -2) {
      scoreP = 3;
      breakdown.push({ label: 'イーグル以上', p: 3, type: 'bonus' });
    } else if (diff === -1) {
      scoreP = 2;
      breakdown.push({ label: 'バーディ', p: 2, type: 'bonus' });
    } else if (diff === 0) {
      scoreP = 1;
      breakdown.push({ label: 'パー', p: 1, type: 'bonus' });
    }

    let bonusP = 0;
    let bonusCount = 0;
    if (d.chipIn) {
      bonusP += 2;
      bonusCount++;
      breakdown.push({ label: 'チップイン (0パット)', p: 2, type: 'bonus' });
    }
    if (d.onePat) {
      bonusP += 1;
      bonusCount++;
      breakdown.push({ label: '1パット', p: 1, type: 'bonus' });
    }
    if (d.saoIchi) {
      bonusP += 1;
      bonusCount++;
      breakdown.push({ label: 'サオイチ', p: 1, type: 'bonus' });
    }
    if (d.sunaIchi) {
      bonusP += 1;
      bonusCount++;
      breakdown.push({ label: '砂イチ', p: 1, type: 'bonus' });
    }

    let penP = 0;
    let penCount = 0;
    if (d.threePat) {
      penP -= 1;
      penCount++;
      breakdown.push({ label: `3パット (${d.putts}打)`, p: -1, type: 'pen' });
    }
    if (d.ob) {
      penP -= 1;
      penCount++;
      breakdown.push({ label: 'OB', p: -1, type: 'pen' });
    }
    if (d.water) {
      penP -= 1;
      penCount++;
      breakdown.push({ label: '池', p: -1, type: 'pen' });
    }
    if (d.bunker) {
      penP -= 1;
      penCount++;
      breakdown.push({ label: 'バンカー', p: -1, type: 'pen' });
    }

    let autoBonusP = 0;
    let isBounceBack = false;
    let isObPar = false;

    if (holeNum > 1) {
      const prevPar = holeConfig[holeNum - 2].par;
      const prevData = getPlayerScoreData(holeNum - 1, player);
      const prevDiff = prevData.gross - prevPar;
      const currDiff = d.gross - par;
      if (prevDiff >= 2 && currDiff < prevDiff) {
        autoBonusP += 1;
        isBounceBack = true;
        breakdown.push({ label: 'バウンスバック賞', p: 1, type: 'auto' });
      }
    }
    if (d.ob && d.gross === par + 2) {
      autoBonusP += 1;
      isObPar = true;
      breakdown.push({ label: 'OBパー賞 (ダボ耐え)', p: 1, type: 'auto' });
    }

    const totalP = scoreP + bonusP + penP + autoBonusP;
    return {
      scoreP,
      bonusP,
      penP,
      autoBonusP,
      totalP,
      bonusCount,
      penCount,
      isBounceBack,
      isObPar,
      breakdown
    };
  };

  const calculateAccumulatedStats = (upToHole, player) => {
    let cumNet = 0, cumGross = 0, cumPutts = 0;
    let cumBonusCount = 0, cumPenCount = 0, cumTotalP = 0;
    let cumScoreP = 0, cumBonusP = 0, cumPenP = 0, cumAutoP = 0;

    let chipInCount = 0, onePatCount = 0, saoIchiCount = 0, sunaIchiCount = 0;
    let bounceBackCount = 0, obParCount = 0, obCount = 0, waterCount = 0;
    let bunkerCount = 0, threePatCount = 0;

    let eagleCount = 0, birdieCount = 0, parCount = 0, bogeyCount = 0, doubleBogeyPlusCount = 0;
    let girCount = 0, completedHolesCount = 0, penaltyHolesCount = 0, bunkerHolesCount = 0;

    for (let h = 1; h <= upToHole; h++) {
      const par = holeConfig[h - 1].par;
      const d = getPlayerScoreData(h, player);
      const pts = calculateHolePoints(h, player);

      cumNet += d.net;
      cumGross += d.gross;
      cumPutts += d.putts;
      cumBonusCount += pts.bonusCount;
      cumPenCount += pts.penCount;
      cumTotalP += pts.totalP;
      cumScoreP += pts.scoreP;
      cumBonusP += pts.bonusP;
      cumPenP += pts.penP;
      cumAutoP += pts.autoBonusP;

      if (d.isCompleted) completedHolesCount++;
      if (d.chipIn) chipInCount++;
      if (d.onePat) onePatCount++;
      if (d.saoIchi) saoIchiCount++;
      if (d.sunaIchi) sunaIchiCount++;
      if (pts.isBounceBack) bounceBackCount++;
      if (pts.isObPar) obParCount++;
      if (d.ob) obCount++;
      if (d.water) waterCount++;
      if (d.bunker) { bunkerCount++; bunkerHolesCount++; }
      if (d.threePat) threePatCount++;
      if (d.ob || d.water || d.bunker || d.threePat) penaltyHolesCount++;

      const diff = d.gross - par;
      if (diff <= -2) eagleCount++;
      else if (diff === -1) birdieCount++;
      else if (diff === 0) parCount++;
      else if (diff === 1) bogeyCount++;
      else doubleBogeyPlusCount++;

      if (d.gross - d.putts <= par - 2) girCount++;
    }

    return {
      cumNet, cumGross, cumPutts, cumBonusCount, cumPenCount, cumTotalP,
      cumScoreP, cumBonusP, cumPenP, cumAutoP,
      chipInCount, onePatCount, saoIchiCount, sunaIchiCount,
      bounceBackCount, obParCount, obCount, waterCount, bunkerCount,
      bunkerHolesCount, threePatCount, eagleCount, birdieCount, parCount,
      bogeyCount, doubleBogeyPlusCount, girCount, completedHolesCount, penaltyHolesCount
    };
  };

  const isPrevHoleAllCompleted = (holeNum) => {
    if (holeNum <= 1) return true;
    const prevHole = holeNum - 1;
    return activePlayers
      .filter(p => !p.isGhost)
      .every(p => scores[prevHole]?.[p.id]?.isCompleted);
  };

  const vegasSortedRank = useMemo(() => {
    const rankMap = {};
    for (let h = 1; h <= 18; h++) {
      if (h === 1) {
        const order = h1RandomOrder.length === activePlayers.length
          ? h1RandomOrder.map(id => activePlayers.find(p => p.id === id)).filter(Boolean)
          : [...activePlayers];
        rankMap[h] = order;
      } else {
        const prevH = h - 1;
        const candidates = activePlayers.map(p => {
          const prevD = getPlayerScoreData(prevH, p);
          const prevPts = calculateHolePoints(prevH, p);
          const cum = calculateAccumulatedStats(prevH, p);
          const prevGameP = prevPts.bonusP + prevPts.penP;

          return {
            player: p,
            prevNet: prevD.net,
            prevGross: prevD.gross,
            prevGameP: prevGameP,
            prevBonus: prevPts.bonusCount,
            prevPen: prevPts.penCount,
            cumNet: cum.cumNet,
            cumGross: cum.cumGross,
            cumBonus: cum.cumBonusCount,
            cumPen: cum.cumPenCount,
            hdcpVal: p.hdcpVal,
            originalIndex: activePlayers.findIndex(ap => ap.id === p.id)
          };
        });

        candidates.sort((a, b) => {
          if (a.prevNet !== b.prevNet) return a.prevNet - b.prevNet;
          if (a.prevGross !== b.prevGross) return a.prevGross - b.prevGross;
          if (a.prevGameP !== b.prevGameP) return b.prevGameP - a.prevGameP;
          if (a.prevBonus !== b.prevBonus) return b.prevBonus - a.prevBonus;
          if (a.prevPen !== b.prevPen) return a.prevPen - b.prevPen;
          if (a.cumNet !== b.cumNet) return a.cumNet - b.cumNet;
          if (a.cumGross !== b.cumGross) return a.cumGross - b.cumGross;
          if (a.cumBonus !== b.cumBonus) return b.cumBonus - a.cumBonus;
          if (a.cumPen !== b.cumPen) return a.cumPen - b.cumPen;
          if (a.hdcpVal !== b.hdcpVal) return a.hdcpVal - b.hdcpVal;
          return a.originalIndex - b.originalIndex;
        });

        rankMap[h] = candidates.map(c => c.player);
      }
    }
    return rankMap;
  }, [activePlayers, scores, h1RandomOrder, holeConfig]);

  const getHolePairs = (holeNum) => {
    const ranked = vegasSortedRank[holeNum] || [];
    const pairs = [];
    const N = ranked.length;
    const pairCount = Math.floor(N / 2);
    for (let i = 0; i < pairCount; i++) {
      pairs.push({
        teamIndex: i + 1,
        p1: ranked[i],
        p2: ranked[N - 1 - i]
      });
    }
    return pairs;
  };

  const calculateVegasPointsForHole = (holeNum) => {
    const pairs = getHolePairs(holeNum);
    const pairCount = pairs.length;
    const payoutTable = VEGAS_PAYOUT_TABLE[pairCount] || [3, 2, 1];

    const evaluatedPairs = pairs.map((pair, idx) => {
      const d1 = getPlayerScoreData(holeNum, pair.p1);
      const d2 = getPlayerScoreData(holeNum, pair.p2);
      const isBothCompleted = d1.isCompleted && d2.isCompleted;

      let teamScore = null;
      if (isBothCompleted) {
        teamScore = Math.min(d1.net, d2.net) * 10 + Math.max(d1.net, d2.net);
      }

      return { ...pair, teamScore, isBothCompleted, idx, d1, d2 };
    });

    const isAllPairsCompleted = evaluatedPairs.length > 0 && evaluatedPairs.every(p => p.isBothCompleted);

    const teamPoints = {};
    const playerPoints = {};
    activePlayers.forEach(p => { playerPoints[p.id] = 0; });

    if (isAllPairsCompleted) {
      const sorted = [...evaluatedPairs].sort((a, b) => a.teamScore - b.teamScore);
      let currentIndex = 0;
      while (currentIndex < sorted.length) {
        let sameCount = 1;
        while (
          currentIndex + sameCount < sorted.length &&
          sorted[currentIndex + sameCount].teamScore === sorted[currentIndex].teamScore
        ) {
          sameCount++;
        }

        let totalPForTies = 0;
        for (let k = 0; k < sameCount; k++) {
          const rankPos = currentIndex + k;
          if (rankPos < payoutTable.length) {
            totalPForTies += payoutTable[rankPos];
          }
        }

        const splitPoint = totalPForTies / sameCount;
        for (let k = 0; k < sameCount; k++) {
          const team = sorted[currentIndex + k];
          teamPoints[team.idx] = splitPoint;
        }
        currentIndex += sameCount;
      }

      pairs.forEach((pair, idx) => {
        const awarded = teamPoints[idx] || 0;
        if (!pair.p1.isGhost) playerPoints[pair.p1.id] = awarded;
        if (!pair.p2.isGhost) playerPoints[pair.p2.id] = awarded;
      });
    }

    return { evaluatedPairs, teamPoints, playerPoints, isAllPairsCompleted };
  };

  const titlePointsSummary = useMemo(() => {
    const playerCumulativeTitle = {};
    const holeAwarded = {};
    activePlayers.forEach(p => { playerCumulativeTitle[p.id] = 0; });

    let nearpinCarry = 10;
    let draconCarry = 10;

    holeConfig.forEach(hConfig => {
      const h = hConfig.hole;
      if (!hConfig.titleType) return;

      const isNearpin = hConfig.titleType === 'NEARPIN';
      let currentPot = isNearpin ? nearpinCarry : draconCarry;
      currentPot = Math.min(20, currentPot);

      const winnerId = titleWinners[h];
      holeAwarded[h] = { pot: currentPot, winnerId, awardedPoint: 0, isBlocked: false };

      if (!winnerId || winnerId === 'NONE') {
        if (isNearpin) nearpinCarry = Math.min(20, currentPot + 10);
        else draconCarry = Math.min(20, currentPot + 10);
      } else {
        const currentTotal = playerCumulativeTitle[winnerId] || 0;
        const availableCap = Math.max(0, 20 - currentTotal);
        const actualAward = Math.min(currentPot, availableCap);

        holeAwarded[h].awardedPoint = actualAward;
        holeAwarded[h].isBlocked = actualAward === 0;

        playerCumulativeTitle[winnerId] = currentTotal + actualAward;

        if (isNearpin) nearpinCarry = 10;
        else draconCarry = 10;
      }
    });

    return { playerCumulativeTitle, holeAwarded };
  }, [titleWinners, activePlayers, holeConfig]);

  const totalVegasPMap = useMemo(() => {
    const totalVegasP = {};
    activePlayers.forEach(p => { totalVegasP[p.id] = 0; });
    for (let h = 1; h <= 18; h++) {
      const v = calculateVegasPointsForHole(h);
      activePlayers.forEach(p => {
        totalVegasP[p.id] += v.playerPoints[p.id] || 0;
      });
    }
    return totalVegasP;
  }, [activePlayers, scores, h1RandomOrder, holeConfig]);

  const leaderboardData = useMemo(() => {
    const list = activePlayers.map(p => {
      const cum = calculateAccumulatedStats(18, p);
      const titleP = titlePointsSummary.playerCumulativeTitle[p.id] || 0;
      const vegasP = totalVegasPMap[p.id] || 0;
      const finalP = cum.cumTotalP + vegasP + titleP;

      return {
        player: p,
        gross: cum.cumGross,
        net: cum.cumNet,
        holeTotalP: cum.cumTotalP,
        bonusCount: cum.cumBonusCount,
        penCount: cum.cumPenCount,
        vegasP,
        titleP,
        finalP,
        stats: cum
      };
    });

    list.sort((a, b) => {
      if (a.player.isGhost) return 1;
      if (b.player.isGhost) return -1;
      let diff = 0;
      if (sortField === 'name') diff = a.player.name.localeCompare(b.player.name);
      else if (sortField === 'finalP') diff = a.finalP - b.finalP;
      else if (sortField === 'net') diff = a.net - b.net;
      else if (sortField === 'gross') diff = a.gross - b.gross;
      else if (sortField === 'bonus') diff = a.bonusCount - b.bonusCount;
      else if (sortField === 'pen') diff = a.penCount - b.penCount;
      return sortAsc ? diff : -diff;
    });

    return list;
  }, [activePlayers, scores, titleWinners, titlePointsSummary, totalVegasPMap, sortField, sortAsc, holeConfig]);

  const handleSort = (field) => {
    if (sortField === field) setSortAsc(!sortAsc);
    else { setSortField(field); setSortAsc(false); }
  };

  const updateHoleScore = (playerId, field, value) => {
    setScores(prev => {
      const hObj = { ...(prev[currentHole] || {}) };
      const pObj = { ...(hObj[playerId] || {}) };
      pObj[field] = value;
      if (field === 'sunaIchi' && value === true) {
        pObj.bunker = true;
      }
      hObj[playerId] = pObj;
      return { ...prev, [currentHole]: hObj };
    });
  };

  const toggleScoreCompletion = (playerId) => {
    const currentStatus = scores[currentHole]?.[playerId]?.isCompleted || false;
    updateHoleScore(playerId, 'isCompleted', !currentStatus);
  };

  const handleHoleChange = (nextHole) => {

      if (!winner) {

  const handleParSelect = (targetType, slotIndex, newHole) => {

                  {compHistory.map(item => (

                              </div>
                            )}
                            {pts.breakdown.length === 0 && titleAwarded === 0 && (
                              <span className="text-slate-400">P増減内訳なし</span>
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          })()}

        </div>
      )}

      {/* ルール説明モーダル */}
      {showRuleModal && (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-center justify-center p-3">
          <div className="bg-white border border-slate-200 rounded-2xl max-w-sm w-full max-h-[88vh] flex flex-col shadow-2xl overflow-hidden">
            <div className="p-3 border-b border-slate-200 flex items-center justify-between bg-slate-50">
              <h2 className="text-sm font-bold text-slate-800 flex items-center gap-1.5">
                <span>📖 公式コンペルール詳細</span>
              </h2>
              <button
                onClick={() => setShowRuleModal(false)}
                className="w-7 h-7 rounded-full bg-slate-200 text-slate-600 text-xs font-bold"
              >
                ✕
              </button>
            </div>

            <div className="bg-slate-100 px-2 py-1.5 border-b border-slate-200 flex overflow-x-auto no-scrollbar space-x-1 text-[11px] font-bold">
              {[
                { id: 1, label: '① 概要・HDCP' },
                { id: 2, label: '② スコア・役' },
                { id: 3, label: '③ ラスベガス' },
                { id: 4, label: '④ タイトルP' },
                { id: 5, label: '⑤ 操作・進行' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setRuleModalTab(t.id)}
                  className={`flex-shrink-0 px-2.5 py-1.5 rounded-lg transition ${
                    ruleModalTab === t.id
                      ? 'bg-emerald-600 text-white'
                      : 'text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            <div className="p-3.5 overflow-y-auto space-y-3 text-xs text-slate-700 leading-relaxed">
              {ruleModalTab === 1 && (
                <div className="space-y-2.5">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-emerald-800 text-xs mb-1">1. 大会基本形式</h3>
                    <p className="text-[11px]">
                      ・4〜20名対応の完全加算ポイント制。<br/>
                      ・「スコアP」「役ボーナスP」「ラスベガスP」「タイトルP」の全合算で最終順位を決定します。
                    </p>
                  </div>
                  <div className="bg-amber-50/70 p-3 rounded-xl border border-amber-200">
                    <h3 className="font-bold text-amber-900 text-xs mb-1">2. 奇数時のゴースト自動補完</h3>
                    <p className="text-[11px]">
                      ・奇数人数の場合、自動で「👻 ゴースト」が追加され偶数化。<br/>
                      ・全ホール<b>「ボギー固定（Par+1）」</b>、入力不要。<br/>
                      ・ベガス入賞時は<b>生身のパートナーのみポイント獲得</b>。
                    </p>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-blue-900 text-xs mb-1">3. 個別ハンディキャップ (HDCP)</h3>
                    <p className="text-[11px]">
                      ・プレイヤーごとに適用ホールとHDCP値（+1〜-3）を設定。<br/>
                      ・<b>完全ネット基準</b>: スコア判定、ベガス打数、順位付けはすべてネット打数を基準とします。
                    </p>
                  </div>
                </div>
              )}

              {ruleModalTab === 2 && (
                <div className="space-y-2.5">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-emerald-800 text-xs mb-1">1. スコアポイント (ネット基準)</h3>
                    <ul className="text-[11px] space-y-0.5">
                      <li>・イーグル以上: <b>+3P</b></li>
                      <li>・バーディ: <b>+2P</b></li>
                      <li>・パー: <b>+1P</b></li>
                      <li>・ボギー以上: <b>0P（減点なし）</b></li>
                    </ul>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-blue-900 text-xs mb-1">2. パット連動自動判定 & 小技ボーナス</h3>
                    <ul className="text-[11px] space-y-0.5">
                      <li>・0パット: <b>チップイン自動判定 (+2P)</b></li>
                      <li>・1パット: <b>1パット自動判定 (+1P)</b></li>
                      <li>・3パット以上: <b className="text-red-600">3パット自動判定 (-1P)</b></li>
                      <li>・サオイチ: <b>+1P</b> (独立トグル)</li>
                      <li>・砂イチ: <b>+1P</b> (砂イチONでバンカー自動ON)</li>
                      <li>・OB / 池 / バンカー: <b className="text-red-600">各-1P</b> (独立トグル)</li>
                    </ul>
                  </div>
                  <div className="bg-emerald-50/70 p-3 rounded-xl border border-emerald-300">
                    <h3 className="font-bold text-emerald-950 text-xs mb-1">3. 全自動救済ボーナス詳細 & 具体例</h3>
                    <div className="space-y-1.5 text-[11px]">
                      <div>
                        <b className="text-emerald-900">① バウンスバック賞 (+1P)</b>
                        <p className="text-slate-600 mt-0.5">
                          前ホールでグロスPar+2以上（ダボ以上）の大叩きをした後、当該ホールでPar基準1打以上改善した場合に自動付与。
                        </p>
                        <div className="bg-white p-2 rounded border border-emerald-200 mt-1 space-y-1 text-[10px]">
                          <p><span className="text-emerald-700 font-bold">【例A 獲得】</span> 前H(Par4)で「6打(+2)」➔ 次H(Par4)で「5打(+1)」で上がった（1打改善 ➔ <b>+1P獲得！</b>）</p>
                          <p><span className="text-emerald-700 font-bold">【例B 獲得】</span> 前H(Par5)で「8打(+3)」➔ 次H(Par3)で「3打(Par)」で上がった（3打改善 ➔ <b>+1P獲得！</b>）</p>
                          <p><span className="text-red-600 font-bold">【例C 対象外】</span> 前H(Par4)で「6打(+2)」➔ 次H(Par4)でも「6打(+2)」だった（改善なし ➔ <b>0P</b>）</p>
                        </div>
                      </div>
                      <div className="pt-1 border-t border-emerald-200">
                        <b className="text-emerald-900">② OBパー賞 (+1P)</b>
                        <p className="text-slate-600 mt-0.5">
                          ティーショット等でOB（前進4打含む）を打ちながらも、グロスPar+2（ダボ耐え）で上がった執念のナイスリカバリーに対して自動付与。
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {ruleModalTab === 3 && (
                <div className="space-y-2.5">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-emerald-800 text-xs mb-1">1. ラスベガスゲーム概要</h3>
                    <p className="text-[11px]">
                      ペアのネット打数を昇順で並べた2桁数字（例: 4打と5打 ➔ 45点）が小さいチームが上位。
                    </p>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-emerald-800 text-xs mb-1">2. 上位過半数スライド配当表</h3>
                    <div className="text-[10px] space-y-0.5 text-slate-600">
                      <p>・2ペア (4人): 1位 2P</p>
                      <p>・3〜4ペア (5〜8人): 1位 3P / 2位 1P</p>
                      <p>・5〜6ペア (9〜12人): 1位 3P / 2位 2P / 3位 1P</p>
                      <p>・7〜8ペア (13〜16人): 1位 4P / 2位 3P / 3位 2P / 4位 1P</p>
                      <p>・9〜10ペア (17〜20人): 1位 5P / 2位 4P / 3位 3P / 4位 2P / 5位 1P</p>
                    </div>
                  </div>
                  <div className="bg-amber-50/70 p-3 rounded-xl border border-amber-300">
                    <h3 className="font-bold text-amber-950 text-xs mb-1">3. 同点（タイ）時の山分け計算 & 具体例</h3>
                    <p className="text-[11px] text-slate-700">
                      同じチーム点数で並んだ場合、該当する順位のポイントを合計し、<b>同点チーム数で均等に山分け（スプリット）</b>配当します。
                    </p>
                    <div className="bg-white p-2 rounded border border-amber-200 mt-1 space-y-1 text-[10px]">
                      <p className="font-bold text-amber-900">※5ペア参加（配当: 1位 3P / 2位 2P / 3位 1P）の場合：</p>
                      <p><span className="text-amber-800 font-bold">【例1：1位タイが2組】</span> 1位(3P) + 2位(2P) = 計5P を2組で等分 ➔ <b>各チーム2.5Pずつ</b>獲得。次点は3位(1P)。</p>
                      <p><span className="text-amber-800 font-bold">【例2：2位タイが3組】</span> 1位(3P)確定後、2位(2P) + 3位(1P) = 計3P を3組で等分 ➔ <b>各チーム1.0Pずつ</b>獲得。</p>
                    </div>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-blue-900 text-xs mb-1">4. 全11段階タイブレーク & たすき掛け</h3>
                    <p className="text-[10px] text-slate-600">
                      1.前Hネット ➔ 2.前Hグロス ➔ 3.前HゲームP ➔ 4.前H小技数 ➔ 5.前Hペナ数 ➔ 6.累計ネット ➔ 7.累計グロス ➔ 8.累計ボナ数 ➔ 9.累計ペナ数 ➔ 10.HDCP ➔ 11.登録順 で厳密に決定し、1位&最下位を組ませる<b>たすき掛け</b>で編成。前H全員完了までチームは非公開です。
                    </p>
                  </div>
                </div>
              )}

              {ruleModalTab === 4 && (
                <div className="space-y-2.5">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-amber-900 text-xs mb-1">1. 対象ホール & 基本配当</h3>
                    <p className="text-[11px]">
                      ・ニアピン: 幹事指定のPar3 (4ホール)<br/>
                      ・ドラコン: 幹事指定のPar5 (4ホール)<br/>
                      ・基本配当: <b>10P</b>（該当なし時は次回へ持ち越し / 上限20P）。
                    </p>
                  </div>
                  <div className="bg-red-50/70 p-3 rounded-xl border border-red-200">
                    <h3 className="font-bold text-red-900 text-xs mb-1">2. 累計20P上限 ＆ 完全ブロッカー</h3>
                    <p className="text-[11px]">
                      ・個人累計で<b>最大20Pまで</b>獲得可能。<br/>
                      ・すでに累計20Pに達している人が獲得した場合、付与は<b>+0P</b>となり、他人の獲得を阻止してその回のポイントを消滅させます。
                    </p>
                  </div>
                </div>
              )}

              {ruleModalTab === 5 && (
                <div className="space-y-2.5">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-emerald-800 text-xs mb-1">1. キーボードレス直感操作</h3>
                    <p className="text-[11px]">
                      ・打数・パット数は [-] [+] ステッパーで直感調整。<br/>
                      ・チップイン/1パット/3パットはパット数から完全自動判定。
                    </p>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-amber-900 text-xs mb-1">2. 確定と修正</h3>
                    <p className="text-[11px]">
                      ・スコア入力後は「✓ スコアを確定する」を押すとカードがグレーアウトし誤操作を防止。<br/>
                      ・修正したい場合は「✏️ 修正する」を押せばいつでも再調整可能です。
                    </p>
                  </div>
                </div>
              )}
            </div>

            <div className="p-3 bg-slate-50 border-t border-slate-200">
              <button
                onClick={() => setShowRuleModal(false)}
                className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition"
              >
                閉じる
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
