<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ゴルフコンペ リアルタイム集計システム</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* モバイル操作時のタップ領域＆スクロールバー制御 */
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 antialiased min-h-screen">

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// --- コース基本スペック (Par設定 & タイトル対象) ---
const HOLE_CONFIG = [
  { hole: 1,  par: 4, titleType: null },
  { hole: 2,  par: 5, titleType: 'DRACON' },
  { hole: 3,  par: 3, titleType: 'NEARPIN' },
  { hole: 4,  par: 4, titleType: null },
  { hole: 5,  par: 4, titleType: null },
  { hole: 6,  par: 4, titleType: null },
  { hole: 7,  par: 3, titleType: 'NEARPIN' },
  { hole: 8,  par: 5, titleType: 'DRACON' },
  { hole: 9,  par: 4, titleType: null },
  { hole: 10, par: 4, titleType: null },
  { hole: 11, par: 4, titleType: null },
  { hole: 12, par: 3, titleType: 'NEARPIN' },
  { hole: 13, par: 5, titleType: 'DRACON' },
  { hole: 14, par: 4, titleType: null },
  { hole: 15, par: 4, titleType: null },
  { hole: 16, par: 4, titleType: null },
  { hole: 17, par: 3, titleType: 'NEARPIN' },
  { hole: 18, par: 5, titleType: 'DRACON' },
];

// --- ラスベガス 上位過半数配当テーブル ---
const VEGAS_PAYOUT_TABLE = {
  2:  [2],
  3:  [3, 1],
  4:  [3, 1],
  5:  [3, 2, 1],
  6:  [3, 2, 1],
  7:  [4, 3, 2, 1],
  8:  [4, 3, 2, 1],
  9:  [5, 4, 3, 2, 1],
  10: [5, 4, 3, 2, 1]
};

// 初期プレイヤー20名テンプレート
const DEFAULT_PLAYERS = Array.from({ length: 20 }, (_, i) => ({
  id: `p${i + 1}`,
  name: `プレイヤー ${i + 1}`,
  hdcpVal: 0,
  hdcpScope: 'NONE', // 'NONE' | 'ALL' | 'PAR4_5' | 'PAR4'
  isGhost: false
}));

function App() {
  // === 主要 State ===
  const [playerCount, setPlayerCount] = useState(10); // 4〜20名
  const [players, setPlayers] = useState(DEFAULT_PLAYERS);
  const [currentHole, setCurrentHole] = useState(1);
  const [activeTab, setActiveTab] = useState('input'); // 'input' | 'leaderboard'
  const [showRuleModal, setShowRuleModal] = useState(false);
  const [ruleModalTab, setRuleModalTab] = useState(1);
  const [showConfigModal, setShowConfigModal] = useState(false);
  const [toastMessage, setToastMessage] = useState(null);

  // 1ホール目のランダムシード（初回生成）
  const [h1RandomOrder, setH1RandomOrder] = useState([]);

  // タイトルP 獲得者: { holeNum: playerId | 'NONE' | null }
  const [titleWinners, setTitleWinners] = useState({});

  // 各プレイヤーの全18ホールスコアデータ
  // scores[hole][playerId] = { gross, chipIn, onePat, saoIchi, sunaIchi, ob, water, bunker, threePat, isCompleted }
  const [scores, setScores] = useState(() => {
    const init = {};
    for (let h = 1; h <= 18; h++) {
      init[h] = {};
    }
    return init;
  });

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3000);
  };

  // --- アクティブプレイヤーリスト（奇数の場合は自動でゴーストを補完） ---
  const activePlayers = useMemo(() => {
    const raw = players.slice(0, playerCount).map(p => ({ ...p, isGhost: false }));
    if (playerCount % 2 !== 0) {
      raw.push({
        id: 'ghost_dummy',
        name: '👻 ゴースト (欠席枠)',
        hdcpVal: 0,
        hdcpScope: 'NONE',
        isGhost: true
      });
    }
    return raw;
  }, [players, playerCount]);

  // 1H用ランダム順序の初期化・更新
  useEffect(() => {
    const ids = activePlayers.map(p => p.id);
    const shuffled = [...ids].sort(() => Math.random() - 0.5);
    setH1RandomOrder(shuffled);
  }, [playerCount]);

  // --- HDCP適用判定 ---
  const isHdcpApplicable = (scope, par) => {
    if (scope === 'ALL') return true;
    if (scope === 'PAR4_5') return par === 4 || par === 5;
    if (scope === 'PAR4') return par === 4;
    return false;
  };

  // --- プレイヤー×ホールのネットスコア取得 ---
  const getPlayerScoreData = (holeNum, player) => {
    const par = HOLE_CONFIG[holeNum - 1].par;
    if (player.isGhost) {
      return {
        gross: par + 1,
        net: par + 1,
        chipIn: false,
        onePat: false,
        saoIchi: false,
        sunaIchi: false,
        ob: false,
        water: false,
        bunker: false,
        threePat: false,
        isCompleted: true
      };
    }

    const holeScore = scores[holeNum]?.[player.id];
    const gross = holeScore?.gross !== undefined ? holeScore.gross : par;
    const applicable = isHdcpApplicable(player.hdcpScope, par);
    const net = applicable ? gross + player.hdcpVal : gross;

    return {
      gross,
      net,
      chipIn: holeScore?.chipIn || false,
      onePat: holeScore?.onePat || false,
      saoIchi: holeScore?.saoIchi || false,
      sunaIchi: holeScore?.sunaIchi || false,
      ob: holeScore?.ob || false,
      water: holeScore?.water || false,
      bunker: holeScore?.bunker || false,
      threePat: holeScore?.threePat || false,
      isCompleted: holeScore?.isCompleted || false
    };
  };

  // --- ホール単体のボーナス・ペナルティ・スコアP計算 ---
  const calculateHolePoints = (holeNum, player) => {
    if (player.isGhost) return { scoreP: 0, bonusP: 0, penP: 0, autoBonusP: 0, totalP: 0, bonusCount: 0, penCount: 0 };

    const par = HOLE_CONFIG[holeNum - 1].par;
    const d = getPlayerScoreData(holeNum, player);

    // 1. スコアポイント (ネット基準)
    const diff = d.net - par;
    let scoreP = 0;
    if (diff <= -2) scoreP = 3;      // イーグル以上
    else if (diff === -1) scoreP = 2; // バーディ
    else if (diff === 0) scoreP = 1;  // パー
    else scoreP = 0;                  // ボギー以上

    // 2. 小技ボーナス (手動トグル)
    let bonusP = 0;
    let bonusCount = 0;
    if (d.chipIn) { bonusP += 2; bonusCount++; }
    if (d.onePat) { bonusP += 1; bonusCount++; }
    if (d.saoIchi) { bonusP += 1; bonusCount++; } // ワンパットと連動で実質+2P
    if (d.sunaIchi) { bonusP += 1; bonusCount++; }

    // 3. ペナルティ (手動トグル)
    let penP = 0;
    let penCount = 0;
    if (d.ob) { penP -= 1; penCount++; }
    if (d.water) { penP -= 1; penCount++; }
    if (d.bunker) { penP -= 1; penCount++; }
    if (d.threePat) { penP -= 1; penCount++; }

    // 4. 全自動ボーナス (タイブレーク個数には含めない)
    let autoBonusP = 0;
    // (a) バウンスバック賞: 前HグロスPar+2以上 ➔ 当該HでPar基準1打以上改善
    if (holeNum > 1) {
      const prevPar = HOLE_CONFIG[holeNum - 2].par;
      const prevData = getPlayerScoreData(holeNum - 1, player);
      const prevDiff = prevData.gross - prevPar;
      const currDiff = d.gross - par;
      if (prevDiff >= 2 && currDiff < prevDiff) {
        autoBonusP += 1;
      }
    }
    // (b) OBパー賞: OBあり ＋ グロスPar+2（ダボ）
    if (d.ob && d.gross === par + 2) {
      autoBonusP += 1;
    }

    const totalP = scoreP + bonusP + penP + autoBonusP;
    return { scoreP, bonusP, penP, autoBonusP, totalP, bonusCount, penCount };
  };

  // --- 全ホール累計集計（タイブレーク用 & 総合用） ---
  const calculateAccumulatedStats = (upToHole, player) => {
    let cumNet = 0;
    let cumGross = 0;
    let cumBonusCount = 0;
    let cumPenCount = 0;
    let cumTotalP = 0;

    for (let h = 1; h <= upToHole; h++) {
      const d = getPlayerScoreData(h, player);
      const pts = calculateHolePoints(h, player);
      cumNet += d.net;
      cumGross += d.gross;
      cumBonusCount += pts.bonusCount;
      cumPenCount += pts.penCount;
      cumTotalP += pts.totalP;
    }
    return { cumNet, cumGross, cumBonusCount, cumPenCount, cumTotalP };
  };

  // --- 前ホールの生身全員が入力完了しているか判定 ---
  const isPrevHoleAllCompleted = (holeNum) => {
    if (holeNum <= 1) return true;
    const prevHole = holeNum - 1;
    return activePlayers
      .filter(p => !p.isGhost)
      .every(p => scores[prevHole]?.[p.id]?.isCompleted);
  };

  // --- ラスベガス 9段階厳密順位付け (holeNumホールのペア決定用) ---
  const vegasSortedRank = useMemo(() => {
    const rankMap = {};
    for (let h = 1; h <= 18; h++) {
      if (h === 1) {
        const order = h1RandomOrder.length === activePlayers.length
          ? h1RandomOrder.map(id => activePlayers.find(p => p.id === id)).filter(Boolean)
          : [...activePlayers];
        rankMap[h] = order;
      } else {
        const prevH = h - 1;
        const candidates = activePlayers.map(p => {
          const prevD = getPlayerScoreData(prevH, p);
          const prevPts = calculateHolePoints(prevH, p);
          const cum = calculateAccumulatedStats(prevH, p);
          return {
            player: p,
            prevNet: prevD.net,
            prevGross: prevD.gross,
            prevBonus: prevPts.bonusCount,
            prevPen: prevPts.penCount,
            cumNet: cum.cumNet,
            cumGross: cum.cumGross,
            cumBonus: cum.cumBonusCount,
            cumPen: cum.cumPenCount,
            originalIndex: activePlayers.findIndex(ap => ap.id === p.id)
          };
        });

        // 9段階ソート
        candidates.sort((a, b) => {
          if (a.prevNet !== b.prevNet) return a.prevNet - b.prevNet; // 1. 前Hネット少
          if (a.prevGross !== b.prevGross) return a.prevGross - b.prevGross; // 2. 前Hグロス少
          if (a.prevBonus !== b.prevBonus) return b.prevBonus - a.prevBonus; // 3. 前H役多
          if (a.prevPen !== b.prevPen) return a.prevPen - b.prevPen; // 4. 前Hペナ少
          if (a.cumNet !== b.cumNet) return a.cumNet - b.cumNet; // 5. 累計ネット少
          if (a.cumGross !== b.cumGross) return a.cumGross - b.cumGross; // 6. 累計グロス少
          if (a.cumBonus !== b.cumBonus) return b.cumBonus - a.cumBonus; // 7. 累計役多
          if (a.cumPen !== b.cumPen) return a.cumPen - b.cumPen; // 8. 累計ペナ少
          return a.originalIndex - b.originalIndex; // 9. ID順
        });

        rankMap[h] = candidates.map(c => c.player);
      }
    }
    return rankMap;
  }, [activePlayers, scores, h1RandomOrder]);

  // --- ラスベガス たすき掛けペアリング ---
  const getHolePairs = (holeNum) => {
    const ranked = vegasSortedRank[holeNum] || [];
    const pairs = [];
    const N = ranked.length;
    const pairCount = Math.floor(N / 2);
    for (let i = 0; i < pairCount; i++) {
      pairs.push({
        teamIndex: i + 1,
        p1: ranked[i],
        p2: ranked[N - 1 - i]
      });
    }
    return pairs;
  };

  // --- 各ホールのラスベガス獲得P計算（上位過半数スライド＆同点山分け） ---
  const calculateVegasPointsForHole = (holeNum) => {
    const pairs = getHolePairs(holeNum);
    const pairCount = pairs.length;
    const payoutTable = VEGAS_PAYOUT_TABLE[pairCount] || [3, 2, 1];

    // 各ペアのチーム数字を算出 (例: 4打と5打 ➔ 45)
    const evaluatedPairs = pairs.map((pair, idx) => {
      const d1 = getPlayerScoreData(holeNum, pair.p1);
      const d2 = getPlayerScoreData(holeNum, pair.p2);
      const minNet = Math.min(d1.net, d2.net);
      const maxNet = Math.max(d1.net, d2.net);
      const teamScore = minNet * 10 + maxNet;
      return { ...pair, teamScore, idx };
    });

    // チーム数字の昇順でソート
    evaluatedPairs.sort((a, b) => a.teamScore - b.teamScore);

    // 同点山分け配当ロジック
    const teamPoints = {};
    let currentIndex = 0;
    while (currentIndex < evaluatedPairs.length) {
      let sameCount = 1;
      while (
        currentIndex + sameCount < evaluatedPairs.length &&
        evaluatedPairs[currentIndex + sameCount].teamScore === evaluatedPairs[currentIndex].teamScore
      ) {
        sameCount++;
      }

      let totalPForTies = 0;
      for (let k = 0; k < sameCount; k++) {
        const rankPos = currentIndex + k;
        if (rankPos < payoutTable.length) {
          totalPForTies += payoutTable[rankPos];
        }
      }

      const splitPoint = totalPForTies / sameCount;
      for (let k = 0; k < sameCount; k++) {
        const team = evaluatedPairs[currentIndex + k];
        teamPoints[team.idx] = splitPoint;
      }
      currentIndex += sameCount;
    }

    // プレイヤーごとのポイントマップ化（ゴースト分は喪失）
    const playerPoints = {};
    activePlayers.forEach(p => { playerPoints[p.id] = 0; });

    pairs.forEach((pair, idx) => {
      const awarded = teamPoints[idx] || 0;
      if (!pair.p1.isGhost) playerPoints[pair.p1.id] = awarded;
      if (!pair.p2.isGhost) playerPoints[pair.p2.id] = awarded;
      // ゴースト自身は 0P
    });

    return { evaluatedPairs, teamPoints, playerPoints };
  };

  // --- タイトルP（ニアピン・ドラコン）配当・持ち越し・上限ブロッカー計算 ---
  const titlePointsSummary = useMemo(() => {
    const playerCumulativeTitle = {};
    const holeAwarded = {};
    activePlayers.forEach(p => { playerCumulativeTitle[p.id] = 0; });

    let nearpinCarry = 10;
    let draconCarry = 10;

    HOLE_CONFIG.forEach(hConfig => {
      const h = hConfig.hole;
      if (!hConfig.titleType) return;

      const isNearpin = hConfig.titleType === 'NEARPIN';
      let currentPot = isNearpin ? nearpinCarry : draconCarry;
      currentPot = Math.min(20, currentPot); // 上限20P

      const winnerId = titleWinners[h];
      holeAwarded[h] = { pot: currentPot, winnerId, awardedPoint: 0, isBlocked: false };

      if (!winnerId || winnerId === 'NONE') {
        // 持ち越し (最大20P)
        if (isNearpin) nearpinCarry = Math.min(20, currentPot + 10);
        else draconCarry = Math.min(20, currentPot + 10);
      } else {
        // 獲得者がいる場合
        const currentTotal = playerCumulativeTitle[winnerId] || 0;
        const availableCap = Math.max(0, 20 - currentTotal);
        const actualAward = Math.min(currentPot, availableCap);

        holeAwarded[h].awardedPoint = actualAward;
        holeAwarded[h].isBlocked = actualAward === 0; // 完全ブロッカー発動

        playerCumulativeTitle[winnerId] = currentTotal + actualAward;

        // 獲得者が出たため持ち越しリセット (次回10P)
        if (isNearpin) nearpinCarry = 10;
        else draconCarry = 10;
      }
    });

    return { playerCumulativeTitle, holeAwarded };
  }, [titleWinners, activePlayers]);

  // --- 総合リーダーボード集計 ---
  const leaderboardData = useMemo(() => {
    // 全ホールのベガスP集計
    const totalVegasP = {};
    activePlayers.forEach(p => { totalVegasP[p.id] = 0; });
    for (let h = 1; h <= 18; h++) {
      const v = calculateVegasPointsForHole(h);
      activePlayers.forEach(p => {
        totalVegasP[p.id] += v.playerPoints[p.id] || 0;
      });
    }

    return activePlayers.map(p => {
      const cum = calculateAccumulatedStats(18, p);
      const titleP = titlePointsSummary.playerCumulativeTitle[p.id] || 0;
      const vegasP = totalVegasP[p.id] || 0;
      const finalP = cum.cumTotalP + vegasP + titleP;

      return {
        player: p,
        gross: cum.cumGross,
        net: cum.cumNet,
        holeTotalP: cum.cumTotalP,
        vegasP,
        titleP,
        finalP
      };
    }).sort((a, b) => {
      if (a.player.isGhost) return 1;
      if (b.player.isGhost) return -1;
      if (b.finalP !== a.finalP) return b.finalP - a.finalP;
      return a.net - b.net;
    });
  }, [activePlayers, scores, titleWinners, titlePointsSummary]);

  // --- 入力値の更新ヘルパー ---
  const updateHoleScore = (playerId, field, value) => {
    setScores(prev => {
      const hObj = { ...(prev[currentHole] || {}) };
      const pObj = { ...(hObj[playerId] || {}) };

      // サオイチ連動: ONならワンパットも自動ON
      if (field === 'saoIchi' && value === true) {
        pObj.onePat = true;
      }
      // 砂イチ連動: ONならバンカーとワンパットも自動ON
      if (field === 'sunaIchi' && value === true) {
        pObj.bunker = true;
        pObj.onePat = true;
      }

      pObj[field] = value;
      hObj[playerId] = pObj;
      return { ...prev, [currentHole]: hObj };
    });
  };

  const toggleScoreCompletion = (playerId) => {
    const currentStatus = scores[currentHole]?.[playerId]?.isCompleted || false;
    updateHoleScore(playerId, 'isCompleted', !currentStatus);
  };

  // --- ホール移動ガード（タイトル未選択チェック） ---
  const handleHoleChange = (nextHole) => {
    const currentHoleConfig = HOLE_CONFIG[currentHole - 1];
    if (currentHoleConfig.titleType) {
      const winner = titleWinners[currentHole];
      if (!winner) {
        showToast(`⚠️ Hole ${currentHole}の${currentHoleConfig.titleType === 'NEARPIN' ? 'ニアピン' : 'ドラコン'}獲得者を選択してください（なしの場合は「該当なし」を選択）`);
        return;
      }
    }
    setCurrentHole(nextHole);
  };

  const currentHoleConfig = HOLE_CONFIG[currentHole - 1];
  const prevHoleAllDone = isPrevHoleAllCompleted(currentHole);
  const currentPairs = getHolePairs(currentHole);
  const vegasResults = calculateVegasPointsForHole(currentHole);

  return (
    <div className="max-w-md mx-auto min-h-screen flex flex-col bg-slate-900 border-x border-slate-800 shadow-2xl relative pb-20">
      
      {/* トースト表示 */}
      {toastMessage && (
        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-rose-600/95 backdrop-blur text-white text-xs px-4 py-2.5 rounded-full shadow-2xl border border-rose-400 font-bold animate-bounce flex items-center space-x-1">
          <span>{toastMessage}</span>
        </div>
      )}

      {/* --- ヘッダーバー --- */}
      <header className="sticky top-0 z-40 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div>
          <h1 className="text-base font-black tracking-wider text-emerald-400 flex items-center gap-1.5">
            <span>⛳️ GOLF VEGAS MASTER</span>
          </h1>
          <p className="text-[10px] text-slate-400">
            参加: <span className="text-emerald-300 font-bold">{playerCount}名</span>
            {playerCount % 2 !== 0 && <span className="text-amber-400 ml-1">(+👻ゴースト)</span>}
            <span className="mx-1.5">|</span>
            ペア: <span className="text-cyan-300 font-bold">{Math.ceil(playerCount / 2)}組</span>
          </p>
        </div>
        <div className="flex items-center space-x-2">
          <button
            onClick={() => setShowRuleModal(true)}
            className="text-xs bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 px-2.5 py-1.5 rounded-lg flex items-center gap-1 transition"
          >
            <span>📖</span>
            <span className="font-semibold">ルール</span>
          </button>
          <button
            onClick={() => setShowConfigModal(true)}
            className="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-2.5 py-1.5 rounded-lg transition"
          >
            ⚙️ 幹事設定
          </button>
        </div>
      </header>

      {/* --- ホールセレクター (横スクロール) --- */}
      <div className="bg-slate-950 border-b border-slate-800 px-2 py-2 overflow-x-auto no-scrollbar flex space-x-1.5">
        {HOLE_CONFIG.map(h => {
          const isSelected = h.hole === currentHole;
          const hasTitle = h.titleType !== null;
          return (
            <button
              key={h.hole}
              onClick={() => handleHoleChange(h.hole)}
              className={`flex-shrink-0 w-11 h-12 rounded-lg flex flex-col items-center justify-center transition border ${
                isSelected
                  ? 'bg-emerald-500 border-emerald-400 text-slate-950 font-black shadow-lg shadow-emerald-500/30'
                  : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'
              }`}
            >
              <span className="text-[11px] leading-none font-bold">H{h.hole}</span>
              <span className="text-[9px] mt-0.5 opacity-80">P{h.par}</span>
              {hasTitle && (
                <span className={`w-1.5 h-1.5 rounded-full mt-0.5 ${h.titleType === 'NEARPIN' ? 'bg-amber-400' : 'bg-cyan-400'}`}></span>
              )}
            </button>
          );
        })}
      </div>

      {/* --- メインコンテンツ領域 --- */}
      {activeTab === 'input' ? (
        <main className="flex-1 p-3 space-y-4">

                          <option value={1}>+1 (ペナルティ)</option>
                          <option value={0}>0 (増減なし)</option>
                          <option value={-1}>-1 (1打引き)</option>
                          <option value={-2}>-2 (2打引き)</option>
                          <option value={-3}>-3 (3打引き)</option>
                        </select>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-3 bg-slate-950 border-t border-slate-800">
              <button
                onClick={() => setShowConfigModal(false)}
                className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl transition"
              >
                設定を保存して閉じる
              </button>
            </div>
          </div>
        </div>
      )}

      {/* ============================================================== */}
      {/* --- ルール説明 モーダル (全5タブ完全版) --- */}
      {/* ============================================================== */}
      {showRuleModal && (
        <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-3">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full max-h-[88vh] flex flex-col shadow-2xl overflow-hidden">
            
            {/* モーダルヘッダー */}
            <div className="p-3 border-b border-slate-800 flex items-center justify-between bg-slate-950">
              <h2 className="text-sm font-black text-white flex items-center gap-1.5">
                <span>📖 公式コンペルール</span>
              </h2>
              <button
                onClick={() => setShowRuleModal(false)}
                className="w-7 h-7 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold"
              >
                ✕
              </button>
            </div>

            {/* 5タブ切り替えバー */}
            <div className="bg-slate-950/80 px-2 py-1.5 border-b border-slate-800 flex overflow-x-auto no-scrollbar space-x-1 text-[11px] font-bold">
              {[
                { id: 1, label: '① 概要・HDCP' },
                { id: 2, label: '② スコア・役' },
                { id: 3, label: '③ ラスベガス' },
                { id: 4, label: '④ タイトルP' },
                { id: 5, label: '⑤ 操作・進行' },
              ].map(t => (
                <button
                  key={t.id}
                  onClick={() => setRuleModalTab(t.id)}
                  className={`flex-shrink-0 px-2.5 py-1.5 rounded-lg transition ${
                    ruleModalTab === t.id
                      ? 'bg-emerald-600 text-white'
                      : 'text-slate-400 hover:bg-slate-800'
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>

            {/* モーダル本文 */}
            <div className="p-3.5 overflow-y-auto space-y-3.5 text-xs text-slate-300 leading-relaxed">
              
              {/* TAB 1: 概要 & HDCP */}
              {ruleModalTab === 1 && (
                <div className="space-y-3">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-emerald-400 text-xs mb-1">1. 大会基本形式</h3>
                    <p className="text-[11px] text-slate-300">
                      ・4〜20名対応の完全加算ポイント制。<br/>
                      ・「スコアP」「役ボーナスP」「ラスベガスP」「タイトルP」の全合算で最終順位を決定します。
                    </p>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-amber-400 text-xs mb-1">2. 奇数時のゴースト（欠席枠）自動補完</h3>
                    <p className="text-[11px] text-slate-300">
                      ・奇数人数の場合、システムが自動で「👻 ゴースト」を1名追加して偶数ペア化。<br/>
                      ・打数は全ホール<b>「ボギー固定（Par+1）」</b>、入力不要。<br/>
                      ・ベガス入賞時は<b>生身のパートナーのみポイント獲得</b>（ゴースト分は喪失）。役・タイトルは対象外です。
                    </p>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-cyan-400 text-xs mb-1">3. 個別HDCP設定</h3>
                    <p className="text-[11px] text-slate-300">
                      ・プレイヤーごとに適用ホール（なし/全H/Par4/5/Par4のみ）とHDCP値（+1〜-3）を設定可能。<br/>
                      ・<b>完全ネット基準</b>: スコア判定、ベガス打数、順位付けはすべてネット打数を基準とします。
                    </p>
                  </div>
                </div>
              )}

              {/* TAB 2: スコア & 役 */}
              {ruleModalTab === 2 && (
                <div className="space-y-3">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-emerald-400 text-xs mb-1">1. スコアポイント (ネット基準)</h3>
                    <ul className="text-[11px] space-y-0.5 text-slate-300">
                      <li>・イーグル以上: <b className="text-white">+3P</b></li>
                      <li>・バーディ: <b className="text-white">+2P</b></li>
                      <li>・パー: <b className="text-white">+1P</b></li>
                      <li>・ボギー以上: <b className="text-slate-400">0P</b></li>
                    </ul>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-amber-400 text-xs mb-1">2. 小技ボーナス & ペナルティ</h3>
                    <ul className="text-[11px] space-y-0.5 text-slate-300">
                      <li>・チップイン: <b className="text-white">+2P</b></li>
                      <li>・ワンパット: <b className="text-white">+1P</b></li>
                      <li>・サオイチ: <b className="text-white">+1P</b> (ワンパット連動で実質+2P)</li>
                      <li>・砂イチ: <b className="text-white">+1P</b> (バンカー/ワンパット連動で実質+1P)</li>
                      <li>・OB / 池 / バンカー / 3パット: <b className="text-rose-400">各-1P</b></li>
                    </ul>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-cyan-400 text-xs mb-1">3. 全自動ボーナス (タイブレーク個数除外)</h3>
                    <ul className="text-[11px] space-y-1 text-slate-300">
                      <li>
                        ・<b className="text-emerald-300">バウンスバック賞 (+1P)</b>:<br/>
                        前HグロスPar+2以上から、次HでPar基準1打以上改善で自動付与。
                      </li>
                      <li>
                        ・<b className="text-emerald-300">OBパー賞 (+1P)</b>:<br/>
                        OBあり＋グロスPar+2（ダボ）で耐え凌いだ場合に自動付与（実質±0P相殺）。
                      </li>
                    </ul>
                  </div>
                </div>
              )}

              {/* TAB 3: ラスベガス */}
              {ruleModalTab === 3 && (
                <div className="space-y-3">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-cyan-400 text-xs mb-1">1. ルール概要</h3>
                    <p className="text-[11px] text-slate-300">
                      ・ペアのネット打数を昇順で並べた2桁数字（例: 4打と5打 ➔ 45組）が小さい方が上位。
                    </p>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-emerald-400 text-xs mb-1">2. 上位過半数スライド配当表</h3>
                    <div className="text-[10px] space-y-1 text-slate-300 mt-1">
                      <p>・2ペア (4人): 1位 2P</p>
                      <p>・3〜4ペア (5〜8人): 1位 3P / 2位 1P</p>
                      <p>・5〜6ペア (9〜12人): 1位 3P / 2位 2P / 3位 1P</p>
                      <p>・7〜8ペア (13〜16人): 1位 4P / 2位 3P / 3位 2P / 4位 1P</p>
                      <p>・9〜10ペア (17〜20人): 1位 5P / 2位 4P / 3位 3P / 4位 2P / 5位 1P</p>
                      <p className="text-amber-400 mt-1">※同点時は均等山分け分配。</p>
                    </div>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-amber-400 text-xs mb-1">3. 9段階優先順位 ＆ たすき掛け</h3>
                    <p className="text-[10px] text-slate-300">
                      1.前Hネット ➔ 2.前Hグロス ➔ 3.前H役数 ➔ 4.前Hペナ数 ➔ 5.累計ネット ➔ 6.累計グロス ➔ 7.累計役数 ➔ 8.累計ペナ数 ➔ 9.登録順<br/>
                      厳密に1〜N位を決定後、最上位と最下位を組ませる<b>たすき掛け</b>で編成。前H全員完了まで非公開です。
                    </p>
                  </div>
                </div>
              )}

              {/* TAB 4: タイトルP */}
              {ruleModalTab === 4 && (
                <div className="space-y-3">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-amber-400 text-xs mb-1">1. 対象ホール & 基本配当</h3>
                    <p className="text-[11px] text-slate-300">
                      ・ニアピン: Par3 (全4H: 3H, 7H, 12H, 17H)<br/>
                      ・ドラコン: Par5 (全4H: 2H, 8H, 13H, 18H)<br/>
                      ・基本配当: <b>10P</b>（該当なし時は次回へ持ち越し / 上限20P）。
                    </p>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-rose-400 text-xs mb-1">2. 累計20P上限 ＆ 完全ブロッカー</h3>
                    <p className="text-[11px] text-slate-300">
                      ・個人累計で<b>最大20Pまで</b>獲得可能。<br/>
                      ・すでに累計20Pに達している人が獲得した場合、付与は<b>+0P</b>となり、<b>他人の獲得を阻止してその回のポイントを消滅</b>させます（次への持ち越しもなし）。
                    </p>
                  </div>
                </div>
              )}

              {/* TAB 5: 操作・進行 */}
              {ruleModalTab === 5 && (
                <div className="space-y-3">
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-emerald-400 text-xs mb-1">1. キーボードレス入力</h3>
                    <p className="text-[11px] text-slate-300">
                      ・打数は [-] [+] ステッパーで直感調整。<br/>
                      ・役・ペナルティはワンタップでON/OFF。
                    </p>
                  </div>
                  <div className="bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <h3 className="font-bold text-amber-400 text-xs mb-1">2. 安全ガード</h3>
                    <p className="text-[11px] text-slate-300">
                      ・前ホール未完了のプレイヤーは次ホールの入力がロックされます。<br/>
                      ・タイトル対象ホールで未選択のまま進行しようとするとトースト警告で停止します。
                    </p>
                  </div>
                </div>
              )}

            </div>

            {/* モーダルフッター */}
            <div className="p-3 bg-slate-950 border-t border-slate-800">
              <button
                onClick={() => setShowRuleModal(false)}
                className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition"
              >
                閉じる
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
