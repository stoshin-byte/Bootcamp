<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAHY5FtpLE8FCI0fr9oJpOAILoQRIs6Tv4",
    authDomain: "bootcamp-a4d13.firebaseapp.com",
    projectId: "bootcamp-a4d13",
    storageBucket: "bootcamp-a4d13.firebasestorage.app",
    messagingSenderId: "731592880059",
    appId: "1:731592880059:web:7b80153979771c1dbd1e9e"
  };

  try {
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const initAuth = async () => {
      try {
        await signInAnonymously(auth);
        window.__FIREBASE_ACTIVE = true;
        window.__FIREBASE_DB = db;
        window.dispatchEvent(new CustomEvent('firebase-ready'));
      } catch (e) {
        console.warn("Auth initialization error:", e);
        window.dispatchEvent(new CustomEvent('firebase-offline'));
      }
    };
    initAuth();
  } catch (err) {
    console.warn("Firebase setup notice:", err);
    window.dispatchEvent(new CustomEvent('firebase-offline'));
  }
</script>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// 更新されたベガス配当テーブル: 2ペア=1P, 3ペア=2P/1P, 4ペア=2P/1P
const VEGAS_PAYOUT_TABLE = {
  2:  [1],          // 2ペア(4名): 1位 1P, 2位 0P (引き分け各0.5P)
  3:  [2, 1],       // 3ペア(5-6名): 1位 2P, 2位 1P, 3位 0P
  4:  [2, 1],       // 4ペア(7-8名): 1位 2P, 2位 1P, 3-4位 0P
  5:  [3, 2, 1],
  6:  [3, 2, 1],
  7:  [4, 3, 2, 1],
  8:  [4, 3, 2, 1],
  9:  [5, 4, 3, 2, 1],
  10: [5, 4, 3, 2, 1]
};

const createEmptySlot = (index) => ({
  id: `p${index + 1}`,
  masterId: '',
  name: '',
  hdcpVal: 0,
  hdcpScope: 'NONE',
  isGhost: false
});

const DEFAULT_PLAYERS = Array.from({ length: 20 }, (_, i) => createEmptySlot(i));
const DEFAULT_PAR_HOLES = [0, 0, 0, 0];

function App() {
  // ルーティング判定: ?view=stats の時のみシークレット表示、?mode=player でスコア入力、それ以外は幹事ホーム
  const [viewMode, setViewMode] = useState(() => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('view') === 'stats') return 'stats';
    if (params.get('mode') === 'player') return 'player';
    return 'admin';
  });

  // 幹事画面の初期選択状態: URLに明示的に comp がない場合は null (未選択ホーム画面)
  const [compId, setCompId] = useState(() => {
    const params = new URLSearchParams(window.location.search);
    return params.get('comp') || null;
  });

  const [compName, setCompName] = useState(() => {
    return compId ? (localStorage.getItem(`golf_comp_name_${compId}`) || '親睦ゴルフコンペ') : '';
  });

  const [compDate, setCompDate] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try {
          const d = JSON.parse(local);
          if (d.compDate) return d.compDate;
        } catch(e){}
      }
    }
    const now = new Date();
    return `${now.getFullYear()}-${('0'+(now.getMonth()+1)).slice(-2)}-${('0'+now.getDate()).slice(-2)}`;
  });

  const [compHistory, setCompHistory] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem('golf_comp_history_list') || '[]');
    } catch {
      return [];
    }
  });

  // スタートコース: 'OUT' (1H〜) または 'IN' (10H〜)
  const [startCourse, setStartCourse] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try { return JSON.parse(local).startCourse || 'OUT'; } catch(e){}
      }
    }
    return 'OUT';
  });

  // 選手マスター名簿 State
  const [playerMaster, setPlayerMaster] = useState(() => {
    try {
      const saved = localStorage.getItem('golf_player_master_list');
      if (saved) return JSON.parse(saved);
    } catch(e){}
    return [];
  });

  // 生涯グロス成績専用アーカイブ State
  const [grossArchive, setGrossArchive] = useState(() => {
    try {
      const saved = localStorage.getItem('golf_player_gross_archive');
      if (saved) return JSON.parse(saved);
    } catch(e){}
    return {};
  });

  const [mainTab, setMainTab] = useState('input');
  const [rankingSubTab, setRankingSubTab] = useState('vegas');
  const [selectedIndividualPlayerId, setSelectedIndividualPlayerId] = useState('p1');
  const [syncStatus, setSyncStatus] = useState('local');

  const [sortField, setSortField] = useState('finalP');
  const [sortAsc, setSortAsc] = useState(false);

  const [playerCount, setPlayerCount] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try { return JSON.parse(local).playerCount || 4; } catch(e){}
      }
    }
    return 4;
  });

  const [players, setPlayers] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try { return JSON.parse(local).players || DEFAULT_PLAYERS; } catch(e){}
      }
    }
    return DEFAULT_PLAYERS;
  });

  const [par3Holes, setPar3Holes] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try {
          const d = JSON.parse(local);
          if (d.par3Holes && Array.isArray(d.par3Holes)) return d.par3Holes;
        } catch(e){}
      }
    }
    return DEFAULT_PAR_HOLES;
  });

  const [par5Holes, setPar5Holes] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try {
          const d = JSON.parse(local);
          if (d.par5Holes && Array.isArray(d.par5Holes)) return d.par5Holes;
        } catch(e){}
      }
    }
    return DEFAULT_PAR_HOLES;
  });

  const [isCompStarted, setIsCompStarted] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try { return JSON.parse(local).isCompStarted || false; } catch(e){}
      }
    }
    return false;
  });

  const [h1RandomOrder, setH1RandomOrder] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try {
          const d = JSON.parse(local);
          if (d.h1RandomOrder && Array.isArray(d.h1RandomOrder)) return d.h1RandomOrder;
        } catch(e){}
      }
    }
    return [];
  });

  // 初期ホール: INスタート設定時は自動的に10H、OUTスタート時は1H
  const [currentHole, setCurrentHole] = useState(() => (startCourse === 'IN' ? 10 : 1));

  // コンペ切り替え・スタートコース変更時にcurrentHoleを確実に追従
  useEffect(() => {
    if (startCourse === 'IN') {
      setCurrentHole(10);
    } else {
      setCurrentHole(1);
    }
  }, [compId, startCourse]);

  const [titleWinners, setTitleWinners] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try { return JSON.parse(local).titleWinners || {}; } catch(e){}
      }
    }
    return {};
  });

  const [scores, setScores] = useState(() => {
    if (compId) {
      const local = localStorage.getItem(`golf_data_${compId}`);
      if (local) {
        try { return JSON.parse(local).scores || {}; } catch(e){}
      }
    }
    const init = {};
    for (let h = 1; h <= 18; h++) init[h] = {};
    return init;
  });

  // モーダル State
  const [showRuleModal, setShowRuleModal] = useState(false);
  const [ruleModalTab, setRuleModalTab] = useState(1);
  const [showShareModal, setShowShareModal] = useState(false);
  const [showNewCompModal, setShowNewCompModal] = useState(false);
  const [newCompNameInput, setNewCompNameInput] = useState('');
  const [newCompStartCourse, setNewCompStartCourse] = useState('OUT');
  const [newCompDateInput, setNewCompDateInput] = useState(() => {
    const now = new Date();
    return `${now.getFullYear()}-${('0'+(now.getMonth()+1)).slice(-2)}-${('0'+now.getDate()).slice(-2)}`;
  });
  const [newCompPar3, setNewCompPar3] = useState([0, 0, 0, 0]);
  const [newCompPar5, setNewCompPar5] = useState([0, 0, 0, 0]);
  
  // コンペ統合モーダル State
  const [showMergeModal, setShowMergeModal] = useState(false);
  const [mergeCompName, setMergeCompName] = useState('');
  const [selectedMergeCompIds, setSelectedMergeCompIds] = useState([]);
  const [mergeTitleLimits, setMergeTitleLimits] = useState({});
  const [mergeSelectedWinners, setMergeSelectedWinners] = useState({});

  // 履歴削除 2択モーダル State
  const [deleteTargetItem, setDeleteTargetItem] = useState(null);

  // 選手マスター編集モーダル
  const [showMasterModal, setShowMasterModal] = useState(false);
  const [editingMasterPlayer, setEditingMasterPlayer] = useState(null);
  const [inputLastName, setInputLastName] = useState('');
  const [inputFirstName, setInputFirstName] = useState('');
  const [inputDisplayName, setInputDisplayName] = useState('');

  // 生涯スタッツ分析 State (viewMode === 'stats')
  const [statsFilterMode, setStatsFilterMode] = useState('last5');
  const [statsCustomStart, setStatsCustomStart] = useState('');
  const [statsCustomEnd, setStatsCustomEnd] = useState('');
  const [statsSelectedMasterId, setStatsSelectedMasterId] = useState('');
  const [statsVsMasterId, setStatsVsMasterId] = useState('');
  const [statsSubTab, setStatsSubTab] = useState('individual');
  const [statsRankingMetric, setStatsRankingMetric] = useState('avgGross');
  
  const [toastMessage, setToastMessage] = useState(null);
  const isRemoteUpdatingRef = useRef(false);

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3000);
  };

  // クラウド同期: 選手マスター (Firestore)
  useEffect(() => {
    localStorage.setItem('golf_player_master_list', JSON.stringify(playerMaster));
    if (window.__FIREBASE_ACTIVE && window.__FIREBASE_DB && !isRemoteUpdatingRef.current) {
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((fLib) => {
        const db = window.__FIREBASE_DB;
        const ref = fLib.doc(db, 'golf_system', 'player_master');
        fLib.setDoc(ref, { list: playerMaster, updatedAt: Date.now() }, { merge: true }).catch(err => console.warn(err));
      });
    }
  }, [playerMaster]);

  // クラウド同期: コンペ履歴一覧 (Firestore)
  useEffect(() => {
    localStorage.setItem('golf_comp_history_list', JSON.stringify(compHistory));
    if (window.__FIREBASE_ACTIVE && window.__FIREBASE_DB && !isRemoteUpdatingRef.current) {
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((fLib) => {
        const db = window.__FIREBASE_DB;
        const ref = fLib.doc(db, 'golf_system', 'comp_history');
        fLib.setDoc(ref, { list: compHistory, updatedAt: Date.now() }, { merge: true }).catch(err => console.warn(err));
      });
    }
  }, [compHistory]);

  // クラウド同期: 生涯グロス成績アーカイブ (Firestore)
  useEffect(() => {
    localStorage.setItem('golf_player_gross_archive', JSON.stringify(grossArchive));
    if (window.__FIREBASE_ACTIVE && window.__FIREBASE_DB && !isRemoteUpdatingRef.current) {
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((fLib) => {
        const db = window.__FIREBASE_DB;
        const ref = fLib.doc(db, 'golf_system', 'player_gross_archive');
        fLib.setDoc(ref, { data: grossArchive, updatedAt: Date.now() }, { merge: true }).catch(err => console.warn(err));
      });
    }
  }, [grossArchive]);

  const saveToHistory = (id, name, course = startCourse, dateStr = compDate) => {
    setCompHistory(prev => {
      const filtered = prev.filter(item => item.id !== id);
      const updated = [{ id, name: name || '名称未設定コンペ', date: dateStr, startCourse: course }, ...filtered];
      return updated;
    });
  };

  const holeConfig = useMemo(() => {
    const validPar3 = par3Holes.filter(h => h >= 1 && h <= 18);
    const validPar5 = par5Holes.filter(h => h >= 1 && h <= 18);

    return Array.from({ length: 18 }, (_, i) => {
      const hNum = i + 1;
      let par = 4;
      let titleType = null;

      if (validPar3.includes(hNum)) {
        par = 3;
        titleType = 'NEARPIN';
      } else if (validPar5.includes(hNum)) {
        par = 5;
        titleType = 'DRACON';
      }

      return {
        hole: hNum,
        par: par,
        titleType: titleType
      };
    });
  }, [par3Holes, par5Holes]);

  // Firestore 双方向同期 (コンペが選択されている場合のみ)
  useEffect(() => {
    if (!compId) return;
    let unsubscribeComp = null;

    const setupSync = () => {
      if (!window.__FIREBASE_ACTIVE || !window.__FIREBASE_DB) {
        setSyncStatus('local');
        return;
      }
      const db = window.__FIREBASE_DB;
      
      import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js").then((fLib) => {
        const refComp = fLib.doc(db, 'golf_comps', compId);
        unsubscribeComp = fLib.onSnapshot(refComp, (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            isRemoteUpdatingRef.current = true;
            if (data.compName) setCompName(data.compName);
            if (data.compDate) setCompDate(data.compDate);
            if (data.startCourse) setStartCourse(data.startCourse);
            if (data.playerCount !== undefined) setPlayerCount(data.playerCount);
            if (data.players) setPlayers(data.players);
            if (data.par3Holes) setPar3Holes(data.par3Holes);
            if (data.par5Holes) setPar5Holes(data.par5Holes);
            if (data.isCompStarted !== undefined) setIsCompStarted(data.isCompStarted);
            if (data.titleWinners) setTitleWinners(data.titleWinners);
            if (data.scores) setScores(data.scores);
            if (data.h1RandomOrder) setH1RandomOrder(data.h1RandomOrder);
            setTimeout(() => { isRemoteUpdatingRef.current = false; }, 150);
            setSyncStatus('synced');
          } else {
            saveData(false);
          }
        }, (err) => {
          console.warn("Firestore comp sync error:", err);
          setSyncStatus('error');
        });
      });
    };

    window.addEventListener('firebase-ready', setupSync);
    if (window.__FIREBASE_ACTIVE) setupSync();

    return () => {
      if (unsubscribeComp) unsubscribeComp();
      window.removeEventListener('firebase-ready', setupSync);
    };
  }, [compId]);

  // スコア更新時に生涯グロスアーカイブを自動同期保存
  const syncCurrentRoundToGrossArchive = (currentScores, currentPlayers) => {
    if (!compId) return;
    setGrossArchive(prev => {
      const updated = { ...prev };
      currentPlayers.forEach(p => {
        if (!p.masterId && !p.name) return;
        const key = p.masterId || p.name.trim();
        const existingList = updated[key] ? [...updated[key]] : [];
        const filtered = existingList.filter(item => item.compId !== compId);

        const holeDataMap = {};
        let completedCount = 0;
        for (let h = 1; h <= 18; h++) {
          const s = currentScores[h]?.[p.id];
          if (s && s.isCompleted) {
            completedCount++;
            holeDataMap[h] = {
              gross: s.gross !== undefined ? s.gross : (holeConfig[h-1].par),
              putts: s.putts !== undefined ? s.putts : 2,
              par: holeConfig[h-1].par,
              ob: s.ob || false,
              water: s.water || false,
              bunker: s.bunker || false,
              sunaIchi: s.sunaIchi || false,
              saoIchi: s.saoIchi || false
            };
          }
        }

        if (completedCount > 0) {
          filtered.push({
            compId,
            compName,
            date: compDate,
            startCourse,
            completedHoles: completedCount,
            holes: holeDataMap
          });
        }

        updated[key] = filtered;
      });
      return updated;
    });
  };

  const saveData = async (isManualChange = true, extraPayload = {}) => {
    if (!compId) return;
    const payload = {
      compName,
      compDate,
      startCourse,
      playerCount,
      players,
      par3Holes,
      par5Holes,
      isCompStarted,
      titleWinners,
      scores,
      h1RandomOrder,
      updatedAt: Date.now(),
      ...extraPayload
    };
    localStorage.setItem(`golf_data_${compId}`, JSON.stringify(payload));
    localStorage.setItem(`golf_comp_name_${compId}`, compName);
    saveToHistory(compId, compName, startCourse, compDate);

    syncCurrentRoundToGrossArchive(payload.scores || scores, payload.players || players);

    if (!window.__FIREBASE_ACTIVE || !window.__FIREBASE_DB) {
      setSyncStatus('local');
      return;
    }
    if (isRemoteUpdatingRef.current) return;

    setSyncStatus('syncing');
    try {
      const fLib = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
      const db = window.__FIREBASE_DB;
      const docRef = fLib.doc(db, 'golf_comps', compId);
      
      await fLib.setDoc(docRef, payload, { merge: true });
      setSyncStatus('synced');
    } catch (err) {
      console.warn("Save error:", err);
      setSyncStatus('error');
    }
  };

  useEffect(() => {
    if (!compId || isRemoteUpdatingRef.current) return;
    const timer = setTimeout(() => {
      saveData(true);
    }, 400);
    return () => clearTimeout(timer);
  }, [compName, compDate, startCourse, playerCount, players, par3Holes, par5Holes, isCompStarted, titleWinners, scores, h1RandomOrder]);

  const activePlayers = useMemo(() => {
    const raw = players.slice(0, playerCount).map((p, idx) => {
      let displayName = p.name.trim();
      if (p.masterId) {
        const m = playerMaster.find(item => item.id === p.masterId);
        if (m) {
          displayName = m.displayName?.trim() || m.lastName?.trim() || m.firstName?.trim() || `選手 ${idx + 1}`;
        }
      }
      return {
        ...p,
        name: displayName || `プレイヤー ${idx + 1}`,
        isGhost: false
      };
    });

    if (playerCount % 2 !== 0) {
      raw.push({
        id: 'ghost_dummy',
        name: '👻 ゴースト (欠席枠)',
        hdcpVal: 0,
        hdcpScope: 'NONE',
        isGhost: true
      });
    }
    return raw;
  }, [players, playerCount, playerMaster]);

  useEffect(() => {
    const ids = activePlayers.map(p => p.id);
    if (h1RandomOrder.length !== ids.length || !h1RandomOrder.every(id => ids.includes(id))) {
      const shuffled = [...ids].sort(() => Math.random() - 0.5);
      setH1RandomOrder(shuffled);
    }
  }, [activePlayers.length]);

  const isHdcpApplicable = (scope, par) => {
    if (scope === 'ALL') return true;
    if (scope === 'PAR4_5') return par === 4 || par === 5;
    if (scope === 'PAR4') return par === 4;
    return false;
  };

  const areAllHumansCompleted = (holeNum) => {
    const humans = activePlayers.filter(p => !p.isGhost);
    if (humans.length === 0) return false;
    return humans.every(p => scores[holeNum]?.[p.id]?.isCompleted === true);
  };

  const getPlayerScoreData = (holeNum, player) => {
    const par = holeConfig[holeNum - 1].par;
    if (player.isGhost) {
      const ghostCompleted = areAllHumansCompleted(holeNum);
      return {
        gross: par + 1,
        net: par + 1,
        putts: 2,
        chipIn: false,
        onePat: false,
        threePat: false,
        saoIchi: false,
        sunaIchi: false,
        ob: false,
        water: false,
        bunker: false,
        isCompleted: ghostCompleted
      };
    }

    const holeScore = scores[holeNum]?.[player.id];
    const gross = holeScore?.gross !== undefined ? holeScore.gross : par;
    const putts = holeScore?.putts !== undefined ? holeScore.putts : 2;

    const applicable = isHdcpApplicable(player.hdcpScope, par);
    const net = applicable ? gross + player.hdcpVal : gross;

    const chipIn = putts === 0;
    const onePat = putts === 1;
    const threePat = putts >= 3;

    return {
      gross,
      net,
      putts,
      chipIn,
      onePat,
      threePat,
      saoIchi: holeScore?.saoIchi || false,
      sunaIchi: holeScore?.sunaIchi || false,
      ob: holeScore?.ob || false,
      water: holeScore?.water || false,
      bunker: holeScore?.bunker || false,
      isCompleted: holeScore?.isCompleted || false
    };
  };

  const getPreviousHoleNum = (hNum) => {
    if (startCourse === 'IN') {
      if (hNum === 10) return null;
      if (hNum === 1) return 18;
      if (hNum >= 11 && hNum <= 18) return hNum - 1;
      return hNum - 1;
    } else {
      if (hNum === 1) return null;
      return hNum - 1;
    }
  };

  const calculateHolePoints = (holeNum, player) => {
    const d = getPlayerScoreData(holeNum, player);

    if (!d.isCompleted || player.isGhost) {
      return {
        scoreP: 0,
        bonusP: 0,
        penP: 0,
        autoBonusP: 0,
        totalP: 0,
        bonusCount: 0,
        penCount: 0,
        isBounceBack: false,
        isObPar: false,
        breakdown: []
      };
    }

    const par = holeConfig[holeNum - 1].par;
    const breakdown = [];

    const diff = d.net - par;
    let scoreP = 0;
    if (diff <= -2) {
      scoreP = 3;
      breakdown.push({ label: 'イーグル以上', p: 3, type: 'bonus' });
    } else if (diff === -1) {
      scoreP = 2;
      breakdown.push({ label: 'バーディ', p: 2, type: 'bonus' });
    } else if (diff === 0) {
      scoreP = 1;
      breakdown.push({ label: 'パー', p: 1, type: 'bonus' });
    }

    let bonusP = 0;
    let bonusCount = 0;
    if (d.chipIn) {
      bonusP += 2;
      bonusCount++;
      breakdown.push({ label: 'チップイン (0パット)', p: 2, type: 'bonus' });
    }
    if (d.onePat) {
      bonusP += 1;
      bonusCount++;
      breakdown.push({ label: '1パット', p: 1, type: 'bonus' });
    }
    if (d.saoIchi) {
      bonusP += 1;
      bonusCount++;
      breakdown.push({ label: 'サオイチ', p: 1, type: 'bonus' });
    }
    if (d.sunaIchi) {
      bonusP += 1;
      bonusCount++;
      breakdown.push({ label: '砂イチ', p: 1, type: 'bonus' });
    }

    let penP = 0;
    let penCount = 0;
    if (d.threePat) {
      penP -= 1;
      penCount++;
      breakdown.push({ label: `3パット (${d.putts}打)`, p: -1, type: 'pen' });
    }
    if (d.ob) {
      penP -= 1;
      penCount++;
      breakdown.push({ label: 'OB (遭遇)', p: -1, type: 'pen' });
    }
    if (d.water) {
      penP -= 1;
      penCount++;
      breakdown.push({ label: '池 (遭遇)', p: -1, type: 'pen' });
    }
    if (d.bunker) {
      penP -= 1;
      penCount++;
      breakdown.push({ label: 'バンカー (遭遇)', p: -1, type: 'pen' });
    }

    let autoBonusP = 0;
    let isBounceBack = false;
    let isObPar = false;

    const prevHNum = getPreviousHoleNum(holeNum);
    if (prevHNum !== null) {
      const prevData = getPlayerScoreData(prevHNum, player);
      if (prevData.isCompleted) {
        const prevPar = holeConfig[prevHNum - 1].par;
        const prevDiff = prevData.gross - prevPar;
        const currDiff = d.gross - par;
        if (prevDiff >= 2 && currDiff < prevDiff) {
          autoBonusP += 1;
          isBounceBack = true;
          breakdown.push({ label: 'バウンスバック賞', p: 1, type: 'auto' });
        }
      }
    }
    if (d.ob && d.gross === par + 2) {
      autoBonusP += 1;
      isObPar = true;
      breakdown.push({ label: 'OBパー賞 (ダボ耐え)', p: 1, type: 'auto' });
    }

    const totalP = scoreP + bonusP + penP + autoBonusP;
    return {
      scoreP,
      bonusP,
      penP,
      autoBonusP,
      totalP,
      bonusCount,
      penCount,
      isBounceBack,
      isObPar,
      breakdown
    };
  };

  const calculateAccumulatedStats = (upToHole, player) => {
    let cumNet = 0, cumGross = 0, cumPutts = 0;
    let cumBonusCount = 0, cumPenCount = 0, cumTotalP = 0;
    let cumScoreP = 0, cumBonusP = 0, cumPenP = 0, cumAutoP = 0;

    let chipInCount = 0, onePatCount = 0, saoIchiCount = 0, sunaIchiCount = 0;
    let bounceBackCount = 0, obParCount = 0, obCount = 0, waterCount = 0;
    let bunkerCount = 0, threePatCount = 0;

    let eagleCount = 0, birdieCount = 0, parCount = 0, bogeyCount = 0, doubleBogeyPlusCount = 0;
    let girCount = 0, completedHolesCount = 0, penaltyHolesCount = 0, bunkerHolesCount = 0;

    for (let h = 1; h <= upToHole; h++) {
      const d = getPlayerScoreData(h, player);
      if (!d.isCompleted) continue;

      const par = holeConfig[h - 1].par;
      const pts = calculateHolePoints(h, player);

      cumNet += d.net;
      cumGross += d.gross;
      cumPutts += d.putts;
      cumBonusCount += pts.bonusCount;
      cumPenCount += pts.penCount;
      cumTotalP += pts.totalP;
      cumScoreP += pts.scoreP;
      cumBonusP += pts.bonusP;
      cumPenP += pts.penP;
      cumAutoP += pts.autoBonusP;

      completedHolesCount++;
      if (d.chipIn) chipInCount++;
      if (d.onePat) onePatCount++;
      if (d.saoIchi) saoIchiCount++;
      if (d.sunaIchi) sunaIchiCount++;
      if (pts.isBounceBack) bounceBackCount++;
      if (pts.isObPar) obParCount++;
      if (d.ob) obCount++;
      if (d.water) waterCount++;
      if (d.bunker) { bunkerCount++; bunkerHolesCount++; }
      if (d.threePat) threePatCount++;
      if (d.ob || d.water || d.bunker || d.threePat) penaltyHolesCount++;

      const diff = d.gross - par;
      if (diff <= -2) eagleCount++;
      else if (diff === -1) birdieCount++;
      else if (diff === 0) parCount++;
      else if (diff === 1) bogeyCount++;
      else doubleBogeyPlusCount++;

      if (d.gross - d.putts <= par - 2) girCount++;
    }

    return {
      cumNet, cumGross, cumPutts, cumBonusCount, cumPenCount, cumTotalP,
      cumScoreP, cumBonusP, cumPenP, cumAutoP,
      chipInCount, onePatCount, saoIchiCount, sunaIchiCount,
      bounceBackCount, obParCount, obCount, waterCount, bunkerCount,
      bunkerHolesCount, threePatCount, eagleCount, birdieCount, parCount,
      bogeyCount, doubleBogeyPlusCount, girCount, completedHolesCount, penaltyHolesCount
    };
  };

  const isPrevHoleAllCompleted = (holeNum) => {
    const prevH = getPreviousHoleNum(holeNum);
    if (prevH === null) return true;
    return activePlayers
      .filter(p => !p.isGhost)
      .every(p => scores[prevH]?.[p.id]?.isCompleted);
  };

  const vegasSortedRank = useMemo(() => {
    const rankMap = {};
    const firstHoleNum = startCourse === 'IN' ? 10 : 1;

    for (let h = 1; h <= 18; h++) {
      if (h === firstHoleNum) {
        const order = h1RandomOrder.length === activePlayers.length
          ? h1RandomOrder.map(id => activePlayers.find(p => p.id === id)).filter(Boolean)
          : [...activePlayers];
        rankMap[h] = order;
      } else {
        const prevH = getPreviousHoleNum(h);
        if (prevH === null) {
          rankMap[h] = [...activePlayers];
          continue;
        }

        const candidates = activePlayers.map(p => {
          const prevD = getPlayerScoreData(prevH, p);
          const prevPts = calculateHolePoints(prevH, p);
          const cum = calculateAccumulatedStats(18, p);
          const prevGameP = prevPts.bonusP + prevPts.penP;

          return {
            player: p,
            prevNet: prevD.net,
            prevGross: prevD.gross,
            prevGameP: prevGameP,
            prevBonus: prevPts.bonusCount,
            prevPen: prevPts.penCount,
            cumNet: cum.cumNet,
            cumGross: cum.cumGross,
            cumBonus: cum.cumBonusCount,
            cumPen: cum.cumPenCount,
            hdcpVal: p.hdcpVal,
            originalIndex: activePlayers.findIndex(ap => ap.id === p.id)
          };
        });

        candidates.sort((a, b) => {
          if (a.prevNet !== b.prevNet) return a.prevNet - b.prevNet;
          if (a.prevGross !== b.prevGross) return a.prevGross - b.prevGross;
          if (a.prevGameP !== b.prevGameP) return b.prevGameP - a.prevGameP;
          if (a.prevBonus !== b.prevBonus) return b.prevBonus - a.prevBonus;
          if (a.prevPen !== b.prevPen) return a.prevPen - b.prevPen;
          if (a.cumNet !== b.cumNet) return a.cumNet - b.cumNet;
          if (a.cumGross !== b.cumGross) return a.cumGross - b.cumGross;
          if (a.cumBonus !== b.cumBonus) return b.cumBonus - a.cumBonus;
          if (a.cumPen !== b.cumPen) return a.cumPen - b.cumPen;
          if (a.hdcpVal !== b.hdcpVal) return a.hdcpVal - b.hdcpVal;
          return a.originalIndex - b.originalIndex;
        });

        rankMap[h] = candidates.map(c => c.player);
      }
    }
    return rankMap;
  }, [activePlayers, scores, h1RandomOrder, holeConfig, startCourse]);

  const getHolePairs = (holeNum) => {
    const ranked = vegasSortedRank[holeNum] || [];
    const pairs = [];
    const N = ranked.length;
    const pairCount = Math.floor(N / 2);
    for (let i = 0; i < pairCount; i++) {
      pairs.push({
        teamIndex: i + 1,
        p1: ranked[i],
        p2: ranked[N - 1 - i]
      });
    }
    return pairs;
  };

  const calculateVegasPointsForHole = (holeNum) => {
    const pairs = getHolePairs(holeNum);
    const pairCount = pairs.length;
    const payoutTable = VEGAS_PAYOUT_TABLE[pairCount] || [2, 1];

    const evaluatedPairs = pairs.map((pair, idx) => {
      const d1 = getPlayerScoreData(holeNum, pair.p1);
      const d2 = getPlayerScoreData(holeNum, pair.p2);
      const isBothCompleted = d1.isCompleted && d2.isCompleted;

      let teamScore = null;
      if (isBothCompleted) {
        teamScore = Math.min(d1.net, d2.net) * 10 + Math.max(d1.net, d2.net);
      }

      return { ...pair, teamScore, isBothCompleted, idx, d1, d2 };
    });

    const isAllPairsCompleted = evaluatedPairs.length > 0 && evaluatedPairs.every(p => p.isBothCompleted);

    const teamPoints = {};
    const playerPoints = {};
    activePlayers.forEach(p => { playerPoints[p.id] = 0; });

    if (isAllPairsCompleted) {
      const sorted = [...evaluatedPairs].sort((a, b) => a.teamScore - b.teamScore);
      let currentIndex = 0;
      while (currentIndex < sorted.length) {
        let sameCount = 1;
        while (
          currentIndex + sameCount < sorted.length &&
          sorted[currentIndex + sameCount].teamScore === sorted[currentIndex].teamScore
        ) {
          sameCount++;
        }

        let totalPForTies = 0;
        for (let k = 0; k < sameCount; k++) {
          const rankPos = currentIndex + k;
          if (rankPos < payoutTable.length) {
            totalPForTies += payoutTable[rankPos];
          }
        }

        const splitPoint = totalPForTies / sameCount;
        for (let k = 0; k < sameCount; k++) {
          const team = sorted[currentIndex + k];
          teamPoints[team.idx] = splitPoint;
        }
        currentIndex += sameCount;
      }

      pairs.forEach((pair, idx) => {
        const awarded = teamPoints[idx] || 0;
        if (!pair.p1.isGhost) playerPoints[pair.p1.id] = awarded;
        if (!pair.p2.isGhost) playerPoints[pair.p2.id] = awarded;
      });
    }

    return { evaluatedPairs, teamPoints, playerPoints, isAllPairsCompleted };
  };

  const titlePointsSummary = useMemo(() => {
    const playerCumulativeTitle = {};
    const holeAwarded = {};
    activePlayers.forEach(p => { playerCumulativeTitle[p.id] = 0; });

    let nearpinCarry = 10;
    let draconCarry = 10;

    holeConfig.forEach(hConfig => {
      const h = hConfig.hole;
      if (!hConfig.titleType) return;

      const isNearpin = hConfig.titleType === 'NEARPIN';
      let currentPot = isNearpin ? nearpinCarry : draconCarry;
      currentPot = Math.min(20, currentPot);

      const rawWinner = titleWinners[h];
      const winnersList = Array.isArray(rawWinner) ? rawWinner : (rawWinner && rawWinner !== 'NONE' ? [rawWinner] : []);

      holeAwarded[h] = { pot: currentPot, winnersList, awardedMap: {} };

      if (winnersList.length === 0) {
        if (isNearpin) nearpinCarry = Math.min(20, currentPot + 10);
        else draconCarry = Math.min(20, currentPot + 10);
      } else {
        winnersList.forEach(wId => {
          const currentTotal = playerCumulativeTitle[wId] || 0;
          const availableCap = Math.max(0, 20 - currentTotal);
          const actualAward = Math.min(currentPot, availableCap);

          holeAwarded[h].awardedMap[wId] = actualAward;
          playerCumulativeTitle[wId] = currentTotal + actualAward;
        });

        if (isNearpin) nearpinCarry = 10;
        else draconCarry = 10;
      }
    });

    return { playerCumulativeTitle, holeAwarded };
  }, [titleWinners, activePlayers, holeConfig]);

  const totalVegasPMap = useMemo(() => {
    const totalVegasP = {};
    activePlayers.forEach(p => { totalVegasP[p.id] = 0; });
    for (let h = 1; h <= 18; h++) {
      const v = calculateVegasPointsForHole(h);
      activePlayers.forEach(p => {
        totalVegasP[p.id] += v.playerPoints[p.id] || 0;
      });
    }
    return totalVegasP;
  }, [activePlayers, scores, h1RandomOrder, holeConfig]);

  const leaderboardData = useMemo(() => {
    const list = activePlayers.map(p => {
      const cum = calculateAccumulatedStats(18, p);
      const titleP = titlePointsSummary.playerCumulativeTitle[p.id] || 0;
      const vegasP = totalVegasPMap[p.id] || 0;
      const finalP = cum.cumTotalP + vegasP + titleP;

      return {
        player: p,
        gross: cum.cumGross,
        net: cum.cumNet,
        holeTotalP: cum.cumTotalP,
        bonusCount: cum.cumBonusCount,
        penCount: cum.cumPenCount,
        vegasP,
        titleP,
        finalP,
        stats: cum
      };
    });

    list.sort((a, b) => {
      if (a.player.isGhost) return 1;
      if (b.player.isGhost) return -1;
      let diff = 0;
      if (sortField === 'name') diff = a.player.name.localeCompare(b.player.name);
      else if (sortField === 'finalP') diff = a.finalP - b.finalP;
      else if (sortField === 'net') diff = a.net - b.net;
      else if (sortField === 'gross') diff = a.gross - b.gross;
      else if (sortField === 'bonus') diff = a.bonusCount - b.bonusCount;
      else if (sortField === 'pen') diff = a.penCount - b.penCount;
      return sortAsc ? diff : -diff;
    });

    return list;
  }, [activePlayers, scores, titleWinners, titlePointsSummary, totalVegasPMap, sortField, sortAsc, holeConfig]);

  const handleSort = (field) => {
    if (sortField === field) setSortAsc(!sortAsc);
    else { setSortField(field); setSortAsc(false); }
  };

  const updateHoleScore = (playerId, field, value) => {
    setScores(prev => {
      const hObj = { ...(prev[currentHole] || {}) };
      const pObj = { ...(hObj[playerId] || {}) };
      pObj[field] = value;
      if (field === 'sunaIchi' && value === true) {
        pObj.bunker = true;
      }
      hObj[playerId] = pObj;
      return { ...prev, [currentHole]: hObj };
    });
  };

  const toggleScoreCompletion = (playerId) => {
    const currentStatus = scores[currentHole]?.[playerId]?.isCompleted || false;
    updateHoleScore(playerId, 'isCompleted', !currentStatus);
  };

  const handleHoleChange = (nextHole) => {
    const curHConfig = holeConfig[currentHole - 1];
    if (curHConfig.titleType) {
      const winner = titleWinners[currentHole];
      if (!winner || (Array.isArray(winner) && winner.length === 0)) {
        showToast(`⚠️ Hole ${currentHole}の${curHConfig.titleType === 'NEARPIN' ? 'ニアピン' : 'ドラコン'}獲得者が未入力です`);
      }
    }
    setCurrentHole(nextHole);
  };

  const handleParSelect = (targetType, slotIndex, newHole) => {
    const val = parseInt(newHole, 10);
    if (targetType === 'par3') {
      const next = [...par3Holes];
      next[slotIndex] = val;
      setPar3Holes(next);
    } else {
      const next = [...par5Holes];
      next[slotIndex] = val;
      setPar5Holes(next);
    }
  };

  const handleClearAllParSettings = () => {
    if (!confirm('ニアピン・ドラコンの対象ホールをすべて解除（-）にしますか？')) return;
    setPar3Holes([0, 0, 0, 0]);
    setPar5Holes([0, 0, 0, 0]);
    saveData(true, { par3Holes: [0, 0, 0, 0], par5Holes: [0, 0, 0, 0] });
    showToast('コース設定をすべて「-（未設定）」に解除しました');
  };

  // 新規コンペ作成ダイアログを開く処理: メンバーを完全初期化し、直前Par設定をプリセットに保持
  const handleOpenNewCompModal = () => {
    setNewCompNameInput('');
    setNewCompStartCourse('OUT');
    const now = new Date();
    setNewCompDateInput(`${now.getFullYear()}-${('0'+(now.getMonth()+1)).slice(-2)}-${('0'+now.getDate()).slice(-2)}`);
    setNewCompPar3([0, 0, 0, 0]);
    setNewCompPar5([0, 0, 0, 0]);
    setShowNewCompModal(true);
  };

  // 直前のコース設定（Par3/Par5）をワンタップでコピー
  const handleCopyPreviousCourseConfig = () => {
    setNewCompPar3([...par3Holes]);
    setNewCompPar5([...par5Holes]);
    showToast('直前のPar3/Par5およびタイトル設定をコピーしました！');
  };

  const handleCreateNewComp = () => {
    if (!newCompNameInput.trim()) {
      showToast('コンペ名を入力してください');
      return;
    }
    const newId = 'comp_' + Date.now();
    setCompId(newId);
    setCompName(newCompNameInput.trim());
    setCompDate(newCompDateInput);
    setStartCourse(newCompStartCourse);
    
    // メンバー引き継ぎを解消: 完全な空枠（未登録状態）で初期化
    const freshPlayers = Array.from({ length: 20 }, (_, i) => createEmptySlot(i));
    setPlayers(freshPlayers);
    setPlayerCount(4);

    setPar3Holes(newCompPar3);
    setPar5Holes(newCompPar5);
    setIsCompStarted(false);

    const initScores = {};
    for (let h = 1; h <= 18; h++) initScores[h] = {};
    setScores(initScores);
    setTitleWinners({});
    setCurrentHole(newCompStartCourse === 'IN' ? 10 : 1);

    setShowNewCompModal(false);

    saveData(true, {
      compId: newId,
      compName: newCompNameInput.trim(),
      compDate: newCompDateInput,
      startCourse: newCompStartCourse,
      playerCount: 4,
      players: freshPlayers,
      par3Holes: newCompPar3,
      par5Holes: newCompPar5,
      isCompStarted: false,
      scores: initScores,
      titleWinners: {}
    });

    showToast(`新コンペ「${newCompNameInput.trim()}」を作成しました！`);
  };

  const handleSelectHistoryComp = (histItem) => {
    setCompId(histItem.id);
    setCompName(histItem.name);
    setCompDate(histItem.date || compDate);
    const local = localStorage.getItem(`golf_data_${histItem.id}`);
    if (local) {
      try {
        const d = JSON.parse(local);
        if (d.startCourse) setStartCourse(d.startCourse);
        if (d.playerCount) setPlayerCount(d.playerCount);
        if (d.players) setPlayers(d.players);
        if (d.par3Holes) setPar3Holes(d.par3Holes);
        if (d.par5Holes) setPar5Holes(d.par5Holes);
        if (d.isCompStarted !== undefined) setIsCompStarted(d.isCompStarted);
        if (d.titleWinners) setTitleWinners(d.titleWinners);
        if (d.scores) setScores(d.scores);
        setCurrentHole(d.startCourse === 'IN' ? 10 : 1);
      } catch(e){}
    }
    showToast(`「${histItem.name}」に切り替えました`);
  };

  const handleRequestDeleteComp = (e, histItem) => {
    e.stopPropagation();
    setDeleteTargetItem(histItem);
  };

  const executeDeleteKeepArchive = () => {
    if (!deleteTargetItem) return;
    const targetId = deleteTargetItem.id;
    setCompHistory(prev => {
      const updated = prev.filter(item => item.id !== targetId);
      localStorage.setItem('golf_comp_history_list', JSON.stringify(updated));
      return updated;
    });
    localStorage.removeItem(`golf_data_${targetId}`);
    localStorage.removeItem(`golf_comp_name_${targetId}`);
    if (compId === targetId) setCompId(null);
    setDeleteTargetItem(null);
    showToast('コンペ一覧から非表示にしました（生涯スコアには維持されます）');
  };

  const executeDeletePurgeAll = () => {
    if (!deleteTargetItem) return;
    const targetId = deleteTargetItem.id;
    setCompHistory(prev => {
      const updated = prev.filter(item => item.id !== targetId);
      localStorage.setItem('golf_comp_history_list', JSON.stringify(updated));
      return updated;
    });
    localStorage.removeItem(`golf_data_${targetId}`);
    localStorage.removeItem(`golf_comp_name_${targetId}`);

    setGrossArchive(prev => {
      const updated = { ...prev };
      Object.keys(updated).forEach(key => {
        updated[key] = (updated[key] || []).filter(item => item.compId !== targetId);
      });
      return updated;
    });

    if (compId === targetId) setCompId(null);
    setDeleteTargetItem(null);
    showToast('コンペデータおよび生涯スコアから完全に抹消しました');
  };

  const handleStartCompetition = () => {
    const ids = activePlayers.map(p => p.id);
    let finalOrder = [...h1RandomOrder];
    if (finalOrder.length !== ids.length || !finalOrder.every(id => ids.includes(id))) {
      finalOrder = [...ids].sort(() => Math.random() - 0.5);
      setH1RandomOrder(finalOrder);
    }
    setIsCompStarted(true);
    saveData(true, { isCompStarted: true, h1RandomOrder: finalOrder });
    showToast(`🚀 コンペを開始しました！${startCourse === 'IN' ? '10' : '1'}番ホールのチームが確定しました。`);
  };

  const handleOpenMergeModal = () => {
    setMergeCompName(`${compName}【総合結果】`);
    setSelectedMergeCompIds(compId ? [compId] : []);
    setMergeTitleLimits({});
    setMergeSelectedWinners({});
    setShowMergeModal(true);
  };

  const handleToggleMergeCompId = (cId) => {
    setSelectedMergeCompIds(prev => {
      let updated;
      if (prev.includes(cId)) {
        updated = prev.filter(id => id !== cId);
      } else {
        if (prev.length >= 5) {
          showToast('統合できるコンペは最大5つまでです');
          return prev;
        }
        updated = [...prev, cId];
      }
      return updated;
    });
  };

  const mergeTitleCandidates = useMemo(() => {
    const map = {};
    holeConfig.forEach(h => {
      if (h.titleType) map[h.hole] = [];
    });

    selectedMergeCompIds.forEach(cId => {
      const raw = localStorage.getItem(`golf_data_${cId}`);
      if (!raw) return;
      try {
        const d = JSON.parse(raw);
        const compTitleWinners = d.titleWinners || {};
        const cPlayers = d.players || [];
        const histItem = compHistory.find(h => h.id === cId);
        const cLabel = histItem ? histItem.name : cId;

        Object.entries(compTitleWinners).forEach(([holeStr, wVal]) => {
          const hNum = parseInt(holeStr, 10);
          if (!map[hNum]) return;
          const wIds = Array.isArray(wVal) ? wVal : (wVal && wVal !== 'NONE' ? [wVal] : []);
          wIds.forEach(wId => {
            const foundP = cPlayers.find(p => p.id === wId);
            if (foundP) {
              const uKey = foundP.masterId || foundP.name.trim();
              map[hNum].push({
                uniqueKey: uKey,
                name: foundP.name,
                compLabel: cLabel,
                masterId: foundP.masterId
              });
            }
          });
        });
      } catch(e){}
    });

    return map;
  }, [selectedMergeCompIds, compHistory, holeConfig]);

  useEffect(() => {
    const initialLimits = {};
    const initialWinners = {};
    const groupCount = Math.max(1, selectedMergeCompIds.length);

    Object.keys(mergeTitleCandidates).forEach(holeStr => {
      const hNum = parseInt(holeStr, 10);
      const candidates = mergeTitleCandidates[hNum] || [];
      initialLimits[hNum] = mergeTitleLimits[hNum] !== undefined ? mergeTitleLimits[hNum] : groupCount;
      const limit = initialLimits[hNum];
      initialWinners[hNum] = mergeSelectedWinners[hNum] || candidates.slice(0, limit).map(c => c.uniqueKey);
    });

    setMergeTitleLimits(prev => ({ ...initialLimits, ...prev }));
    setMergeSelectedWinners(prev => ({ ...initialWinners, ...prev }));
  }, [mergeTitleCandidates, selectedMergeCompIds.length]);

  const handleLimitChange = (holeNum, newLimit) => {
    const lim = parseInt(newLimit, 10);
    setMergeTitleLimits(prev => ({ ...prev, [holeNum]: lim }));
    setMergeSelectedWinners(prev => {
      const current = prev[holeNum] || [];
      return { ...prev, [holeNum]: current.slice(0, lim) };
    });
  };

  const handleToggleWinnerSelection = (holeNum, uKey) => {
    const limit = mergeTitleLimits[holeNum] || 1;
    setMergeSelectedWinners(prev => {
      const current = prev[holeNum] || [];
      if (current.includes(uKey)) {
        return { ...prev, [holeNum]: current.filter(k => k !== uKey) };
      } else {
        if (current.length >= limit) {
          showToast(`このホールは最大${limit}名まで選択可能です`);
          return prev;
        }
        return { ...prev, [holeNum]: [...current, uKey] };
      }
    });
  };

  const executeMergeCompetitions = () => {
    if (selectedMergeCompIds.length === 0) {
      showToast('統合するコンペを1つ以上選択してください');
      return;
    }
    if (!mergeCompName.trim()) {
      showToast('統合後のコンペ名を入力してください');
      return;
    }

    const mergedPlayers = [];
    const mergedScores = {};
    for (let h = 1; h <= 18; h++) mergedScores[h] = {};
    const mergedTitleWinners = {};

    let refPar3Holes = [0, 0, 0, 0];
    let refPar5Holes = [0, 0, 0, 0];

    const processedKeys = new Set();
    const keyToNewIdMap = {};

    selectedMergeCompIds.forEach(cId => {
      const raw = localStorage.getItem(`golf_data_${cId}`);
      if (!raw) return;
      try {
        const cData = JSON.parse(raw);
        if (refPar3Holes.every(h => h === 0) && cData.par3Holes) refPar3Holes = cData.par3Holes;
        if (refPar5Holes.every(h => h === 0) && cData.par5Holes) refPar5Holes = cData.par5Holes;

        const count = cData.playerCount || 4;
        const cPlayers = (cData.players || []).slice(0, count);

        cPlayers.forEach(p => {
          if (!p.name && !p.masterId) return;
          const uniqueKey = p.masterId || p.name.trim();
          if (processedKeys.has(uniqueKey)) return;
          processedKeys.add(uniqueKey);

          const newSlotIndex = mergedPlayers.length;
          if (newSlotIndex >= 20) return;

          const newPlayerId = `p${newSlotIndex + 1}`;
          keyToNewIdMap[uniqueKey] = newPlayerId;

          mergedPlayers.push({
            id: newPlayerId,
            masterId: p.masterId || '',
            name: p.name,
            hdcpVal: p.hdcpVal || 0,
            hdcpScope: p.hdcpScope || 'NONE',
            isGhost: false
          });

          for (let h = 1; h <= 18; h++) {
            if (cData.scores?.[h]?.[p.id]) {
              mergedScores[h][newPlayerId] = { ...cData.scores[h][p.id] };
            }
          }
        });
      } catch(e){}
    });

    if (mergedPlayers.length === 0) {
      showToast('統合対象の有効なプレイヤーデータがありませんでした');
      return;
    }

    Object.entries(mergeSelectedWinners).forEach(([holeStr, uKeys]) => {
      const hNum = parseInt(holeStr, 10);
      const mappedNewIds = uKeys.map(k => keyToNewIdMap[k]).filter(Boolean);
      if (mappedNewIds.length > 0) {
        mergedTitleWinners[hNum] = mappedNewIds.length === 1 ? mappedNewIds[0] : mappedNewIds;
      }
    });

    while (mergedPlayers.length < 20) {
      mergedPlayers.push(createEmptySlot(mergedPlayers.length));
    }

    const mergedCompId = 'comp_merged_' + Date.now();
    const finalPlayerCount = Math.min(20, processedKeys.size);

    setCompId(mergedCompId);
    setCompName(mergeCompName.trim());
    setPlayerCount(finalPlayerCount);
    setPlayers(mergedPlayers);
    setScores(mergedScores);
    setTitleWinners(mergedTitleWinners);
    setPar3Holes(refPar3Holes);
    setPar5Holes(refPar5Holes);
    setIsCompStarted(true);

    const mergedOrder = mergedPlayers.slice(0, finalPlayerCount).map(p => p.id);
    setH1RandomOrder(mergedOrder);

    saveData(true, {
      compId: mergedCompId,
      compName: mergeCompName.trim(),
      playerCount: finalPlayerCount,
      players: mergedPlayers,
      scores: mergedScores,
      titleWinners: mergedTitleWinners,
      par3Holes: refPar3Holes,
      par5Holes: refPar5Holes,
      isCompStarted: true,
      h1RandomOrder: mergedOrder
    });

    setShowMergeModal(false);
    showToast(`🎉 タイトルを反映した「${mergeCompName.trim()}」を作成しました！`);
  };

  const handleOpenMasterModal = (targetPlayer = null) => {
    setEditingMasterPlayer(targetPlayer);
    if (targetPlayer) {
      setInputLastName(targetPlayer.lastName || '');
      setInputFirstName(targetPlayer.firstName || '');
      setInputDisplayName(targetPlayer.displayName || '');
    } else {
      setInputLastName('');
      setInputFirstName('');
      setInputDisplayName('');
    }
    setShowMasterModal(true);
  };

  const handleSaveMasterPlayer = () => {
    if (!inputLastName.trim() && !inputFirstName.trim()) {
      showToast('選手名（姓または名）を入力してください');
      return;
    }

    if (editingMasterPlayer) {
      setPlayerMaster(prev => prev.map(p => {
        if (p.id === editingMasterPlayer.id) {
          return {
            ...p,
            lastName: inputLastName.trim(),
            firstName: inputFirstName.trim(),
            displayName: inputDisplayName.trim()
          };
        }
        return p;
      }));
      showToast('選手情報を更新しました');
    } else {
      const nextNum = playerMaster.length + 1;
      const formattedId = `m${String(nextNum).padStart(3, '0')}`;
      const newEntry = {
        id: formattedId,
        serial: `#${String(nextNum).padStart(3, '0')}`,
        lastName: inputLastName.trim(),
        firstName: inputFirstName.trim(),
        displayName: inputDisplayName.trim(),
        lastHdcpVal: 0,
        lastHdcpScope: 'NONE'
      };
      setPlayerMaster(prev => [...prev, newEntry]);
      showToast(`選手「${newEntry.displayName || newEntry.lastName}」を登録しました！`);
    }
    setShowMasterModal(false);
  };

  const handleDeleteMasterPlayer = (mId) => {
    if (!confirm('この選手を名簿から削除しますか？（参加枠からも解除されます）')) return;
    setPlayerMaster(prev => prev.filter(p => p.id !== mId));
    setPlayers(prev => prev.map(p => p.masterId === mId ? { ...p, masterId: '', name: '' } : p));
    showToast('選手を名簿から削除しました');
  };

  const handleAssignPlayer = (slotIndex, masterId) => {
    if (!masterId) {
      setPlayers(prev => {
        const next = [...prev];
        next[slotIndex] = createEmptySlot(slotIndex);
        return next;
      });
      return;
    }

    const master = playerMaster.find(m => m.id === masterId);
    if (!master) return;

    setPlayers(prev => {
      const next = [...prev];
      const targetSlot = next[slotIndex];
      next[slotIndex] = {
        ...targetSlot,
        masterId: master.id,
        name: master.displayName || master.lastName || master.firstName || `選手 ${slotIndex + 1}`,
        hdcpVal: master.lastHdcpVal !== undefined ? master.lastHdcpVal : 0,
        hdcpScope: master.lastHdcpScope || 'NONE'
      };
      return next;
    });

    showToast(`「${master.displayName || master.lastName}」を配置しました`);
  };

  const handleUpdateHdcp = (slotIndex, field, value) => {
    setPlayers(prev => {
      const next = [...prev];
      next[slotIndex] = { ...next[slotIndex], [field]: value };
      
      const currentMasterId = next[slotIndex].masterId;
      if (currentMasterId) {
        setPlayerMaster(mList => mList.map(m => {
          if (m.id === currentMasterId) {
            return {
              ...m,
              [field === 'hdcpVal' ? 'lastHdcpVal' : 'lastHdcpScope']: value
            };
          }
          return m;
        }));
      }
      return next;
    });
  };

  const getPlayerShareUrl = () => {
    const url = new URL(window.location.origin + window.location.pathname);
    url.searchParams.set('mode', 'player');
    url.searchParams.set('comp', compId);
    return url.toString();
  };

  const copyShareUrl = () => {
    const url = getPlayerShareUrl();
    const textArea = document.createElement("textarea");
    textArea.value = url;
    document.body.appendChild(textArea);
    textArea.select();
    try {
      document.execCommand('copy');
      showToast("📋 参加者用URLをコピーしました！");
    } catch (err) {
      showToast("コピーに失敗しました。手動でコピーしてください。");
    }
    document.body.removeChild(textArea);
  };

  const currentHoleConfig = holeConfig[currentHole - 1];

  // 生涯グロス成績・スタッツ計算ロジック
  const calculateLifetimeStats = (targetMasterId, filterMode, customStart, customEnd) => {
    const allRounds = grossArchive[targetMasterId] || [];
    const sortedRounds = [...allRounds].sort((a, b) => new Date(b.date) - new Date(a.date));

    let targetRounds = sortedRounds;
    if (filterMode === 'last5') {
      targetRounds = sortedRounds.slice(0, 5);
    } else if (filterMode === 'last10') {
      targetRounds = sortedRounds.slice(0, 10);
    } else if (filterMode === 'thisYear') {
      const curYear = new Date().getFullYear();
      targetRounds = sortedRounds.filter(r => new Date(r.date).getFullYear() === curYear);
    } else if (filterMode === 'custom' && (customStart || customEnd)) {
      targetRounds = sortedRounds.filter(r => {
        const d = new Date(r.date);
        if (customStart && d < new Date(customStart)) return false;
        if (customEnd && d > new Date(customEnd)) return false;
        return true;
      });
    }

    let totalGross = 0;
    let totalPutts = 0;
    let totalHoles = 0;
    let outGross = 0, outHoles = 0;
    let inGross = 0, inHoles = 0;

    let bestRound = null;
    let worstRound = null;

    let eagleCount = 0, birdieCount = 0, parCount = 0, bogeyCount = 0, doubleBogeyPlusCount = 0;
    let girCount = 0, parSaveCount = 0, bogeyOnCount = 0;

    let chipInCount = 0, onePattCount = 0, threePattCount = 0;
    let obHoles = 0, waterHoles = 0, bunkerHoles = 0, sunaIchiCount = 0;

    targetRounds.forEach(rnd => {
      let rGross = 0;
      Object.entries(rnd.holes || {}).forEach(([hNumStr, hData]) => {
        const hNum = parseInt(hNumStr, 10);
        const gross = hData.gross;
        const putts = hData.putts;
        const par = hData.par;

        rGross += gross;
        totalGross += gross;
        totalPutts += putts;
        totalHoles++;

        if (hNum <= 9) {
          outGross += gross;
          outHoles++;
        } else {
          inGross += gross;
          inHoles++;
        }

        const diff = gross - par;
        if (diff <= -2) eagleCount++;
        else if (diff === -1) birdieCount++;
        else if (diff === 0) parCount++;
        else if (diff === 1) bogeyCount++;
        else doubleBogeyPlusCount++;

        if (gross - putts <= par - 2) girCount++;
        if (gross - putts <= par - 1) bogeyOnCount++;
        if (diff <= 0) parSaveCount++;

        if (putts === 0) chipInCount++;
        if (putts === 1) onePattCount++;
        if (putts >= 3) threePattCount++;

        if (hData.ob) obHoles++;
        if (hData.water) waterHoles++;
        if (hData.bunker) bunkerHoles++;
        if (hData.sunaIchi) sunaIchiCount++;
      });

      if (rnd.completedHoles >= 18) {
        if (bestRound === null || rGross < bestRound) bestRound = rGross;
        if (worstRound === null || rGross > worstRound) worstRound = rGross;
      }
    });

    const roundCount = targetRounds.length;
    const avgGross = roundCount > 0 ? (totalGross / (totalHoles / 18)).toFixed(1) : '-';
    const avgPuttsPerRound = roundCount > 0 ? (totalPutts / (totalHoles / 18)).toFixed(1) : '-';
    const avgPuttsPerHole = totalHoles > 0 ? (totalPutts / totalHoles).toFixed(2) : '-';

    const avgOut = outHoles > 0 ? ((outGross / outHoles) * 9).toFixed(1) : '-';
    const avgIn = inHoles > 0 ? ((inGross / inHoles) * 9).toFixed(1) : '-';

    const girRate = totalHoles > 0 ? Math.round((girCount / totalHoles) * 100) : 0;
    const parSaveRate = totalHoles > 0 ? Math.round((parSaveCount / totalHoles) * 100) : 0;
    const bogeyOnRate = totalHoles > 0 ? Math.round((bogeyOnCount / totalHoles) * 100) : 0;

    const threePattRate = totalHoles > 0 ? Math.round((threePattCount / totalHoles) * 100) : 0;
    const onePattRate = totalHoles > 0 ? Math.round((onePattCount / totalHoles) * 100) : 0;
    const chipInRate = totalHoles > 0 ? ((chipInCount / totalHoles) * 100).toFixed(1) : 0;

    const obHoleRate = totalHoles > 0 ? Math.round((obHoles / totalHoles) * 100) : 0;
    const waterHoleRate = totalHoles > 0 ? Math.round((waterHoles / totalHoles) * 100) : 0;
    const bunkerHoleRate = totalHoles > 0 ? Math.round((bunkerHoles / totalHoles) * 100) : 0;
    const sandSaveRate = bunkerHoles > 0 ? Math.round((sunaIchiCount / bunkerHoles) * 100) : 0;

    return {
      roundCount,
      totalHoles,
      avgGross,
      bestRound: bestRound !== null ? bestRound : '-',
      worstRound: worstRound !== null ? worstRound : '-',
      avgOut,
      avgIn,
      avgPuttsPerRound,
      avgPuttsPerHole,
      threePattRate,
      onePattRate,
      chipInRate,
      girRate,
      parSaveRate,
      bogeyOnRate,
      eagleCount,
      birdieCount,
      parCount,
      bogeyCount,
      doubleBogeyPlusCount,
      obHoleRate,
      waterHoleRate,
      bunkerHoleRate,
      sandSaveRate,
      rounds: targetRounds
    };
  };

  // =========================================================================
  // VIEW: 生涯グロス成績・スタッツ分析ダッシュボード (?view=stats 専用)
  // =========================================================================
  if (viewMode === 'stats') {
    const activeMasterList = playerMaster.length > 0 ? playerMaster : [
      { id: 'm001', serial: '#001', lastName: '登録なし', firstName: '', displayName: 'プレイヤー未登録' }
    ];
    const currentMasterId = statsSelectedMasterId || activeMasterList[0].id;
    const currentStats = calculateLifetimeStats(currentMasterId, statsFilterMode, statsCustomStart, statsCustomEnd);
    const targetPlayerObj = playerMaster.find(m => m.id === currentMasterId);
    const currentName = targetPlayerObj ? (targetPlayerObj.displayName || targetPlayerObj.lastName) : '選手';

    const vsMasterId = statsVsMasterId || (activeMasterList.length > 1 ? activeMasterList[1].id : activeMasterList[0].id);
    const vsStats = calculateLifetimeStats(vsMasterId, statsFilterMode, statsCustomStart, statsCustomEnd);
    const vsPlayerObj = playerMaster.find(m => m.id === vsMasterId);
    const vsName = vsPlayerObj ? (vsPlayerObj.displayName || vsPlayerObj.lastName) : '相手選手';

    const rankingData = playerMaster.map(m => {
      const st = calculateLifetimeStats(m.id, statsFilterMode, statsCustomStart, statsCustomEnd);
      return {
        master: m,
        name: m.displayName || m.lastName,
        ...st
      };
    }).filter(p => p.roundCount > 0);

    return (
      <div className="max-w-md mx-auto min-h-screen bg-slate-100 text-slate-800 border-x border-slate-200 shadow-sm flex flex-col pb-12">
        <header className="bg-slate-800 text-white px-4 py-3 flex items-center justify-between shadow-xs sticky top-0 z-40">
          <div>
            <h1 className="text-sm font-bold flex items-center gap-1.5">
              <span>📊</span>
              <span>生涯グロス成績 ＆ スタッツ分析</span>
            </h1>
            <p className="text-[10px] text-slate-400">限定公開 / 純粋グロススタッツ完全特化</p>
          </div>
        </header>

        {/* 期間フィルターバー (初期値: 直近5ラウンド) */}
        <div className="bg-white border-b border-slate-200 p-2.5 space-y-2 shadow-xs">
          <div className="flex items-center justify-between text-[11px] font-bold text-slate-500">
            <span>集計期間:</span>
            <span className="text-[10px] text-emerald-700 font-bold bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
              {statsFilterMode === 'last5' ? '直近5ラウンド (ベース表示)' :
               statsFilterMode === 'last10' ? '直近10ラウンド' :
               statsFilterMode === 'thisYear' ? '今年' :
               statsFilterMode === 'all' ? '全期間' : '期間指定'}
            </span>
          </div>

          <div className="grid grid-cols-5 gap-1 text-[11px] font-bold">
            <button
              onClick={() => setStatsFilterMode('last5')}
              className={`py-1.5 rounded-lg transition border ${statsFilterMode === 'last5' ? 'bg-emerald-600 border-emerald-700 text-white shadow-xs' : 'bg-slate-50 border-slate-200 text-slate-700'}`}
            >
              直近5R
            </button>
            <button
              onClick={() => setStatsFilterMode('last10')}
              className={`py-1.5 rounded-lg transition border ${statsFilterMode === 'last10' ? 'bg-emerald-600 border-emerald-700 text-white shadow-xs' : 'bg-slate-50 border-slate-200 text-slate-700'}`}
            >
              直近10R
            </button>
            <button
              onClick={() => setStatsFilterMode('thisYear')}
              className={`py-1.5 rounded-lg transition border ${statsFilterMode === 'thisYear' ? 'bg-emerald-600 border-emerald-700 text-white shadow-xs' : 'bg-slate-50 border-slate-200 text-slate-700'}`}
            >
              今年
            </button>
            <button
              onClick={() => setStatsFilterMode('all')}
              className={`py-1.5 rounded-lg transition border ${statsFilterMode === 'all' ? 'bg-emerald-600 border-emerald-700 text-white shadow-xs' : 'bg-slate-50 border-slate-200 text-slate-700'}`}
            >
              全期間
            </button>
            <button
              onClick={() => setStatsFilterMode('custom')}
              className={`py-1.5 rounded-lg transition border ${statsFilterMode === 'custom' ? 'bg-emerald-600 border-emerald-700 text-white shadow-xs' : 'bg-slate-50 border-slate-200 text-slate-700'}`}
            >
              期間指定
            </button>
          </div>

          {statsFilterMode === 'custom' && (
            <div className="grid grid-cols-2 gap-2 pt-1 border-t border-slate-100 text-xs">
              <div>
                <label className="text-[10px] text-slate-400 block">開始日</label>
                <input
                  type="date"
                  value={statsCustomStart}
                  onChange={(e) => setStatsCustomStart(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded p-1 text-xs"
                />
              </div>
              <div>
                <label className="text-[10px] text-slate-400 block">終了日</label>
                <input
                  type="date"
                  value={statsCustomEnd}
                  onChange={(e) => setStatsCustomEnd(e.target.value)}
                  className="w-full bg-slate-50 border border-slate-300 rounded p-1 text-xs"
                />
              </div>
            </div>
          )}
        </div>

        {/* サブタブ: 個人カルテ / 2人VS比較 / 部門別ランキング */}
        <div className="bg-slate-200 p-1 mx-3 mt-3 rounded-xl grid grid-cols-3 gap-1 shadow-2xs text-xs font-bold">
          <button
            onClick={() => setStatsSubTab('individual')}
            className={`py-1.5 rounded-lg transition flex items-center justify-center gap-1 ${statsSubTab === 'individual' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}`}
          >
            <span>👤 個人カルテ</span>
          </button>
          <button
            onClick={() => setStatsSubTab('vs')}
            className={`py-1.5 rounded-lg transition flex items-center justify-center gap-1 ${statsSubTab === 'vs' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}`}
          >
            <span>⚔️ VS 比較</span>
          </button>
          <button
            onClick={() => setStatsSubTab('ranking')}
            className={`py-1.5 rounded-lg transition flex items-center justify-center gap-1 ${statsSubTab === 'ranking' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600'}`}
          >
            <span>🏆 部門別王座</span>
          </button>
        </div>

        <main className="p-3 space-y-3 flex-1">
          {statsSubTab === 'individual' && (
            <div className="space-y-3">
              <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-xs flex items-center justify-between">
                <span className="text-xs font-bold text-slate-700">対象選手:</span>
                <select
                  value={currentMasterId}
                  onChange={(e) => setStatsSelectedMasterId(e.target.value)}
                  className="bg-slate-50 border border-slate-300 rounded px-2.5 py-1 text-xs font-bold text-slate-800"
                >
                  {playerMaster.map(m => (
                    <option key={m.id} value={m.id}>
                      {m.serial} {m.displayName || `${m.lastName} ${m.firstName}`}
                    </option>
                  ))}
                </select>
              </div>

              {currentStats.roundCount === 0 ? (
                <div className="py-8 text-center text-xs text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">
                  指定期間のラウンド履歴データがありません。<br/>コンペでスコアを入力すると自動蓄積されます。
                </div>
              ) : (
                <>
                  <div className="bg-white rounded-xl p-3.5 border border-slate-200 shadow-xs space-y-2.5">
                    <div className="flex items-center justify-between border-b pb-2">
                      <div>
                        <span className="text-base font-black text-slate-900">{currentName}</span>
                        <span className="text-[10px] text-slate-400 ml-2">対象: {currentStats.roundCount}ラウンド ({currentStats.totalHoles}ホール)</span>
                      </div>
                      <div className="text-right">
                        <span className="text-[10px] text-slate-400 block font-medium">平均グロス</span>
                        <span className="text-xl font-black text-emerald-700">{currentStats.avgGross}</span>
                      </div>
                    </div>

                    <div className="grid grid-cols-4 gap-2 text-center text-xs">
                      <div className="bg-slate-50 p-2 rounded-lg border border-slate-100">
                        <span className="text-[9px] text-slate-400 block">ベスト</span>
                        <b className="text-emerald-800 text-sm">{currentStats.bestRound}</b>
                      </div>
                      <div className="bg-slate-50 p-2 rounded-lg border border-slate-100">

                        <b className="text-red-700 text-sm">{currentStats.worstRound}</b>

                      <div className="bg-slate-50 p-2 rounded-lg border border-slate-100">
