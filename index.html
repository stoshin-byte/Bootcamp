                        <b className="text-slate-800 text-sm">{currentStats.avgOut}</b>
                      </div>
                      <div className="bg-slate-50 p-2 rounded-lg border border-slate-100">
                        <span className="text-[9px] text-slate-400 block">IN平均</span>
                        <b className="text-slate-800 text-sm">{currentStats.avgIn}</b>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl p-3.5 border border-slate-200 shadow-xs space-y-2">
                    <span className="text-xs font-black text-slate-800 block border-b pb-1.5">⛳️ ショット ＆ パット精度</span>
                    
                    <div className="grid grid-cols-3 gap-2 text-center text-xs">
                      <div className="bg-emerald-50/70 p-2 rounded-lg border border-emerald-200">
                        <span className="text-[10px] text-emerald-900 block font-medium">パーオン率 (GIR)</span>
                        <b className="text-base text-emerald-950 font-black">{currentStats.girRate}%</b>
                      </div>
                      <div className="bg-blue-50/70 p-2 rounded-lg border border-blue-200">
                        <span className="text-[10px] text-blue-900 block font-medium">パーセーブ率</span>
                        <b className="text-base text-blue-950 font-black">{currentStats.parSaveRate}%</b>
                      </div>
                      <div className="bg-slate-50 p-2 rounded-lg border border-slate-200">
                        <span className="text-[10px] text-slate-600 block font-medium">ボギーオン率</span>
                        <b className="text-base text-slate-800 font-black">{currentStats.bogeyOnRate}%</b>
                      </div>
                    </div>

                    <div className="grid grid-cols-4 gap-1.5 text-center text-[11px] pt-1">
                      <div className="bg-slate-50 p-1.5 rounded border border-slate-100">
                        <span className="text-[9px] text-slate-400 block">平均パット(R)</span>
                        <b className="text-slate-800">{currentStats.avgPuttsPerRound}</b>
                      </div>
                      <div className="bg-slate-50 p-1.5 rounded border border-slate-100">
                        <span className="text-[9px] text-slate-400 block">1H平均パット</span>
                        <b className="text-slate-800">{currentStats.avgPuttsPerHole}</b>
                      </div>
                      <div className="bg-slate-50 p-1.5 rounded border border-slate-100">
                        <span className="text-[9px] text-slate-400 block">1パット率</span>
                        <b className="text-blue-700">{currentStats.onePattRate}%</b>
                      </div>
                      <div className="bg-slate-50 p-1.5 rounded border border-slate-100">
                        <span className="text-[9px] text-slate-400 block">3パット率</span>
                        <b className="text-red-600">{currentStats.threePattRate}%</b>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl p-3.5 border border-slate-200 shadow-xs space-y-2">
                    <span className="text-xs font-black text-slate-800 block border-b pb-1.5">⚠️ ハザード遭遇率（ホール率）</span>
                    <div className="grid grid-cols-4 gap-2 text-center text-xs">
                      <div className="bg-red-50/60 p-2 rounded-lg border border-red-200">
                        <span className="text-[10px] text-red-900 block font-medium">OB率</span>
                        <b className="text-red-950 font-black text-sm">{currentStats.obHoleRate}%</b>
                      </div>
                      <div className="bg-red-50/60 p-2 rounded-lg border border-red-200">
                        <span className="text-[10px] text-red-900 block font-medium">池率</span>
                        <b className="text-red-950 font-black text-sm">{currentStats.waterHoleRate}%</b>
                      </div>
                      <div className="bg-amber-50/60 p-2 rounded-lg border border-amber-200">
                        <span className="text-[10px] text-amber-900 block font-medium">バンカー率</span>
                        <b className="text-amber-950 font-black text-sm">{currentStats.bunkerHoleRate}%</b>
                      </div>
                      <div className="bg-emerald-50/60 p-2 rounded-lg border border-emerald-200">
                        <span className="text-[10px] text-emerald-900 block font-medium">砂イチ率</span>
                        <b className="text-emerald-950 font-black text-sm">{currentStats.sandSaveRate}%</b>
                      </div>
                    </div>
                  </div>
                </>
              )}
            </div>
          )}

          {statsSubTab === 'vs' && (
            <div className="space-y-3">
              <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-xs grid grid-cols-2 gap-2 text-xs">
                <div>
                  <label className="text-[10px] font-bold text-slate-500 block mb-0.5">選手 A</label>
                  <select
                    value={currentMasterId}
                    onChange={(e) => setStatsSelectedMasterId(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded p-1.5 font-bold"
                  >
                    {playerMaster.map(m => (
                      <option key={m.id} value={m.id}>{m.displayName || m.lastName}</option>
                    ))}
                  </select>
                </div>
                <div>
                  <label className="text-[10px] font-bold text-slate-500 block mb-0.5">選手 B</label>
                  <select
                    value={vsMasterId}
                    onChange={(e) => setStatsVsMasterId(e.target.value)}
                    className="w-full bg-slate-50 border border-slate-300 rounded p-1.5 font-bold"
                  >
                    {playerMaster.map(m => (
                      <option key={m.id} value={m.id}>{m.displayName || m.lastName}</option>
                    ))}
                  </select>
                </div>
              </div>

              <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
                <table className="w-full text-xs text-center border-collapse">
                  <thead>
                    <tr className="bg-slate-100 border-b text-slate-700 font-bold">
                      <th className="p-2.5 text-left w-1/3">スタッツ項目</th>
                      <th className="p-2.5 text-emerald-800 bg-emerald-50/60 truncate">{currentName}</th>
                      <th className="p-2.5 text-blue-800 bg-blue-50/60 truncate">{vsName}</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 font-semibold text-slate-800">
                    <tr>
                      <td className="p-2.5 text-left text-slate-500">対象ラウンド数</td>
                      <td className="p-2.5">{currentStats.roundCount}R</td>
                      <td className="p-2.5">{vsStats.roundCount}R</td>
                    </tr>
                    <tr className="bg-slate-50/50">
                      <td className="p-2.5 text-left text-slate-800 font-bold">平均グロス</td>
                      <td className={`p-2.5 font-black ${parseFloat(currentStats.avgGross) < parseFloat(vsStats.avgGross) ? 'text-emerald-700' : ''}`}>
                        {currentStats.avgGross}
                      </td>
                      <td className={`p-2.5 font-black ${parseFloat(vsStats.avgGross) < parseFloat(currentStats.avgGross) ? 'text-blue-700' : ''}`}>
                        {vsStats.avgGross}
                      </td>
                    </tr>
                    <tr>
                      <td className="p-2.5 text-left text-slate-500">ベストスコア</td>
                      <td className="p-2.5 font-bold">{currentStats.bestRound}</td>
                      <td className="p-2.5 font-bold">{vsStats.bestRound}</td>
                    </tr>
                    <tr className="bg-slate-50/50">
                      <td className="p-2.5 text-left text-slate-800 font-bold">パーオン率 (GIR)</td>
                      <td className={`p-2.5 font-black ${currentStats.girRate > vsStats.girRate ? 'text-emerald-700' : ''}`}>
                        {currentStats.girRate}%
                      </td>
                      <td className={`p-2.5 font-black ${vsStats.girRate > currentStats.girRate ? 'text-blue-700' : ''}`}>
                        {vsStats.girRate}%
                      </td>
                    </tr>
                    <tr>
                      <td className="p-2.5 text-left text-slate-500">平均パット (1R)</td>
                      <td className={`p-2.5 font-black ${parseFloat(currentStats.avgPuttsPerRound) < parseFloat(vsStats.avgPuttsPerRound) ? 'text-emerald-700' : ''}`}>
                        {currentStats.avgPuttsPerRound}
                      </td>
                      <td className={`p-2.5 font-black ${parseFloat(vsStats.avgPuttsPerRound) < parseFloat(currentStats.avgPuttsPerRound) ? 'text-blue-700' : ''}`}>
                        {vsStats.avgPuttsPerRound}
                      </td>
                    </tr>
                    <tr className="bg-slate-50/50">
                      <td className="p-2.5 text-left text-slate-500">OB率 (遭遇)</td>
                      <td className="p-2.5">{currentStats.obHoleRate}%</td>
                      <td className="p-2.5">{vsStats.obHoleRate}%</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {statsSubTab === 'ranking' && (
            <div className="space-y-3">
              <div className="bg-white p-3 rounded-xl border border-slate-200 shadow-xs space-y-2">
                <span className="text-xs font-bold text-slate-700 block">ランキング部門:</span>
                <div className="grid grid-cols-3 gap-1.5 text-xs font-bold">
                  {[
                    { id: 'avgGross', label: '🏌️‍♂️ 平均打数' },
                    { id: 'avgPutts', label: '⛳️ 平均パット' },
                    { id: 'girRate', label: '🎯 パーオン率' },
                    { id: 'parSave', label: '🛡️ パーセーブ' },
                    { id: 'lowOb', label: '🕊️ OB率最小' },
                    { id: 'sandSave', label: '🏖️ 砂イチ率' },
                  ].map(tab => (
                    <button
                      key={tab.id}
                      onClick={() => setStatsRankingMetric(tab.id)}
                      className={`p-2 rounded-lg border text-center transition ${
                        statsRankingMetric === tab.id
                          ? 'bg-emerald-600 border-emerald-700 text-white shadow-xs'
                          : 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-slate-100'
                      }`}
                    >
                      {tab.label}
                    </button>
                  ))}
                </div>
              </div>

              <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
                <div className="divide-y divide-slate-100">
                  {(() => {
                    const sortedList = [...rankingData].sort((a, b) => {
                      if (statsRankingMetric === 'avgGross') return parseFloat(a.avgGross) - parseFloat(b.avgGross);
                      if (statsRankingMetric === 'avgPutts') return parseFloat(a.avgPuttsPerRound) - parseFloat(b.avgPuttsPerRound);
                      if (statsRankingMetric === 'girRate') return b.girRate - a.girRate;
                      if (statsRankingMetric === 'parSave') return b.parSaveRate - a.parSaveRate;
                      if (statsRankingMetric === 'lowOb') return a.obHoleRate - b.obHoleRate;
                      if (statsRankingMetric === 'sandSave') return b.sandSaveRate - a.sandSaveRate;
                      return 0;
                    });

                    if (sortedList.length === 0) {
                      return <div className="p-6 text-center text-xs text-slate-400">データがありません</div>;
                    }

                    return sortedList.map((row, idx) => {
                      let displayVal = '';
                      if (statsRankingMetric === 'avgGross') displayVal = `${row.avgGross}打`;
                      else if (statsRankingMetric === 'avgPutts') displayVal = `${row.avgPuttsPerRound}パット`;
                      else if (statsRankingMetric === 'girRate') displayVal = `${row.girRate}%`;
                      else if (statsRankingMetric === 'parSave') displayVal = `${row.parSaveRate}%`;
                      else if (statsRankingMetric === 'lowOb') displayVal = `${row.obHoleRate}%`;
                      else if (statsRankingMetric === 'sandSave') displayVal = `${row.sandSaveRate}%`;

                      return (
                        <div key={row.master.id} className="p-3 flex items-center justify-between hover:bg-slate-50 text-xs">
                          <div className="flex items-center gap-2">
                            <span className="w-5 text-center font-black text-slate-400">{idx + 1}</span>
                            <div>
                              <span className="font-bold text-slate-800">{row.name}</span>
                              <span className="text-[10px] text-slate-400 block">{row.roundCount}R消化</span>
                            </div>
                          </div>
                          <span className="text-base font-black text-emerald-700">{displayVal}</span>
                        </div>
                      );
                    });
                  })()}
                </div>
              </div>
            </div>
          )}
        </main>
      </div>
    );
  }

  // =========================================================================
  // VIEW 1: 幹事専用ダッシュボード (未選択ホーム画面 & コンペ作業画面)
  // =========================================================================
  if (viewMode === 'admin') {
    return (
      <div className="max-w-md mx-auto min-h-screen bg-white border-x border-slate-200 shadow-sm flex flex-col pb-16">
        {toastMessage && (
          <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-red-600 text-white text-xs px-4 py-2.5 rounded-full shadow-lg font-bold flex items-center space-x-1">
            <span>{toastMessage}</span>
          </div>
        )}

        <header className="bg-emerald-600 text-white px-4 py-3 flex items-center justify-between shadow-xs">
          <div>
            <h1 className="text-base font-bold flex items-center gap-1.5">
              <span>⛳️</span>
              <span className="truncate max-w-[190px]">{compId ? compName : '幹事ダッシュボード'}</span>
            </h1>
            <div className="flex items-center gap-2 mt-0.5">
              <span className={`text-[9px] px-1.5 py-0.2 rounded font-bold ${
                syncStatus === 'synced' ? 'bg-emerald-800 text-emerald-200' :
                syncStatus === 'syncing' ? 'bg-amber-500 text-white animate-pulse' :
                syncStatus === 'local' ? 'bg-slate-700 text-slate-300' : 'bg-red-700 text-white'
              }`}>
                {syncStatus === 'synced' ? '☁️ クラウド同期' :
                 syncStatus === 'syncing' ? '🔄 同期中...' :
                 syncStatus === 'local' ? '💾 保存中' : '⚠️ エラー'}
              </span>
            </div>
          </div>
          {compId && (
            <button
              onClick={() => {
                const url = new URL(window.location.origin + window.location.pathname);
                url.searchParams.set('mode', 'player');
                url.searchParams.set('comp', compId);
                window.location.href = url.toString();
              }}
              className="text-xs bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-3 py-1.5 rounded-lg border border-emerald-500 transition shadow-xs"
            >
              スコア画面へ ➔
            </button>
          )}
        </header>

        <main className="flex-1 p-4 space-y-4">
          
          {/* コンペ未選択ホーム状態 */}
          {!compId ? (
            <div className="space-y-4 py-2">
              <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-5 text-center space-y-3 shadow-xs">
                <span className="text-3xl">⛳️</span>
                <div>
                  <h2 className="text-base font-black text-emerald-950">コンペ管理ホーム</h2>
                  <p className="text-xs text-slate-500 mt-1">新規コンペを作成するか、過去の履歴から選んで開いてください。</p>
                </div>
                <button
                  onClick={handleOpenNewCompModal}
                  className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-black py-3 px-4 rounded-xl text-sm shadow-md transition flex items-center justify-center gap-1.5"
                >
                  <span>＋</span>
                  <span>新しいコンペを作成する</span>
                </button>
              </div>

              {compHistory.length > 0 ? (
                <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-xs space-y-2.5">
                  <span className="text-xs font-bold text-slate-800 flex items-center gap-1">
                    <span>📁</span>
                    <span>保存済みのコンペ履歴 ({compHistory.length}件)</span>
                  </span>
                  <div className="divide-y divide-slate-100">
                    {compHistory.map(item => (
                      <div
                        key={item.id}
                        onClick={() => handleSelectHistoryComp(item)}
                        className="py-2.5 px-2 flex items-center justify-between cursor-pointer hover:bg-slate-50 rounded-lg transition"
                      >
                        <div className="truncate flex-1">
                          <span className="text-[9px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-mono mr-1.5 font-bold">
                            {item.startCourse || 'OUT'}
                          </span>
                          <span className="text-xs font-bold text-slate-800">{item.name}</span>
                          <span className="text-[10px] text-slate-400 ml-2">({item.date})</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <span className="text-xs text-emerald-700 font-bold">開く ➔</span>
                          <button
                            onClick={(e) => handleRequestDeleteComp(e, item)}
                            className="text-slate-400 hover:text-red-600 px-1 font-bold text-xs"
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                <div className="text-center py-6 text-xs text-slate-400 bg-slate-50 rounded-xl border border-dashed">
                  過去のコンペ履歴はありません。
                </div>
              )}
            </div>
          ) : (
            <>
              {/* コンペ選択中: 作業ダッシュボード */}
              <div className="bg-slate-50 border border-slate-200 rounded-xl p-3.5 space-y-3">
                <div className="flex items-center justify-between border-b border-slate-200 pb-2">
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => setCompId(null)}
                      className="text-[10px] bg-slate-200 hover:bg-slate-300 text-slate-700 px-2 py-0.5 rounded font-bold"
                    >
                      ◀ ホームへ
                    </button>
                    <span className="text-xs font-bold text-slate-800">コンペ情報</span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={handleOpenMergeModal}
                      className="bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-bold px-2 py-1 rounded shadow-xs flex items-center gap-1"
                    >
                      <span>🔗</span>
                      <span>統合</span>
                    </button>
                    <button
                      onClick={handleOpenNewCompModal}
                      className="bg-emerald-600 hover:bg-emerald-700 text-white text-[10px] font-bold px-2 py-1 rounded shadow-xs"
                    >
                      ＋ 新規
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <div className="col-span-2">
                    <label className="text-[10px] font-bold text-slate-500 block mb-1">コンペ名:</label>
                    <input
                      type="text"
                      value={compName}
                      onChange={(e) => setCompName(e.target.value)}
                      className="bg-white border border-slate-300 rounded px-2.5 py-1.5 text-xs font-bold text-slate-800 w-full"
                    />
                  </div>
                  <div>
                    <label className="text-[10px] font-bold text-slate-500 block mb-1">開催日:</label>
                    <input
                      type="date"
                      value={compDate}
                      onChange={(e) => setCompDate(e.target.value)}

                    />
                  </div>
                </div>

                <div className="bg-white border border-slate-200 rounded-lg p-2 flex items-center justify-between">
                  <div>
                    <span className="text-xs font-bold text-slate-800 block">スタートコース</span>
                    <span className="text-[10px] text-slate-400">{startCourse === 'IN' ? '10Hから開始' : '1Hから開始'}</span>
                  </div>
                  <div className="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-300 text-xs font-bold">
                    <button
                      onClick={() => {
                        setStartCourse('OUT');
                        setCurrentHole(1);
                        saveData(true, { startCourse: 'OUT' });
                        showToast('OUTスタート (1H〜) に切り替えました');
                      }}
                      className={`px-3 py-1 rounded-md transition ${startCourse === 'OUT' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600'}`}
                    >
                      OUT (1H〜)
                    </button>
                    <button
                      onClick={() => {
                        setStartCourse('IN');
                        setCurrentHole(10);
                        saveData(true, { startCourse: 'IN' });
                        showToast('INスタート (10H〜) に切り替えました');
                      }}
                      className={`px-3 py-1 rounded-md transition ${startCourse === 'IN' ? 'bg-emerald-600 text-white shadow-xs' : 'text-slate-600'}`}
                    >
                      IN (10H〜)
                    </button>
                  </div>
                </div>
              </div>

              {/* コース設定 */}
              <div className="bg-white border border-slate-200 rounded-xl p-3.5 shadow-xs space-y-3">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                  <div>
                    <h2 className="text-xs font-bold text-slate-800 flex items-center gap-1">
                      <span>⛳️</span>
                      <span>ニアピン・ドラコン対象ホール</span>
                    </h2>
                    <p className="text-[10px] text-slate-400 mt-0.5">「-」は通常Par4ホールになります。</p>
                  </div>
                  <button
                    onClick={handleClearAllParSettings}
                    className="bg-slate-100 hover:bg-slate-200 text-slate-700 text-[10px] font-bold px-2 py-1 rounded border border-slate-300 transition"
                  >
                    解除
                  </button>
                </div>

                <div className="bg-amber-50/60 border border-amber-200 rounded-lg p-2.5 space-y-1.5">
                  <span className="text-[11px] font-bold text-amber-900 block">🎯 Par 3 ホール（ニアピン）</span>
                  <div className="grid grid-cols-4 gap-2">
                    {par3Holes.map((hVal, idx) => (
                      <select
                        key={idx}
                        value={hVal}
                        onChange={(e) => handleParSelect('par3', idx, e.target.value)}
                        className="bg-white border border-amber-300 rounded p-1 text-xs font-bold text-slate-800 text-center"
                      >
                        <option value={0}>-</option>
                        {Array.from({ length: 18 }, (_, i) => i + 1).map(h => (
                          <option key={h} value={h}>{h}H</option>
                        ))}
                      </select>
                    ))}
                  </div>
                </div>

                <div className="bg-blue-50/60 border border-blue-200 rounded-lg p-2.5 space-y-1.5">
                  <span className="text-[11px] font-bold text-blue-900 block">🚀 Par 5 ホール（ドラコン）</span>
                  <div className="grid grid-cols-4 gap-2">
                    {par5Holes.map((hVal, idx) => (
                      <select
                        key={idx}
                        value={hVal}
                        onChange={(e) => handleParSelect('par5', idx, e.target.value)}
                        className="bg-white border border-blue-300 rounded p-1 text-xs font-bold text-slate-800 text-center"
                      >
                        <option value={0}>-</option>
                        {Array.from({ length: 18 }, (_, i) => i + 1).map(h => (
                          <option key={h} value={h}>{h}H</option>
                        ))}
                      </select>
                    ))}
                  </div>
                </div>

                        <b className="text-emerald-900">① バウンスバック賞 (+1P)</b>
                        <p className="text-slate-600 mt-0.5">
                          直前のホールでグロスPar+2以上（ダボ以上）の大叩きをした後、当該ホールでPar基準1打以上改善した場合に自動付与（INスタート組の1H直前は18Hとして正しく連動）。
                        </p>
                      </div>
                      <div className="pt-1 border-t border-emerald-200">
                        <b className="text-emerald-900">② OBパー賞 (+1P)</b>
                        <p className="text-slate-600 mt-0.5">
                          ティーショット等でOBを打ちながらも、グロスPar+2（ダボ耐え）で上がった執念のナイスリカバリーに対して自動付与。
                        </p>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {ruleModalTab === 3 && (
                <div className="space-y-2.5">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-emerald-800 text-xs mb-1">1. 組内ラスベガスゲームの配当</h3>
                    <p className="text-[11px] mb-1.5">
                      ペア2名のネット打数を昇順で並べた2桁数字（例: 4打と5打 ➔ 45点）が小さいチームが勝利！
                    </p>
                    <div className="space-y-1 bg-white p-2 rounded border border-slate-200 text-[11px]">
                      <div className="flex justify-between border-b pb-0.5 font-bold text-slate-700">
                        <span>チーム構成 (参加人数)</span>
                        <span>獲得ポイント (各メンバー)</span>
                      </div>
                      <div className="flex justify-between">
                        <span>・<b>2ペア (4名/1組)</b>:</span>
                        <span>1位 <b>各1P</b> / 2位 0P</span>
                      </div>
                      <div className="flex justify-between">
                        <span>・<b>3ペア (5〜6名)</b>:</span>
                        <span>1位 <b>各2P</b> / 2位 <b>各1P</b> / 3位 0P</span>
                      </div>
                      <div className="flex justify-between">
                        <span>・<b>4ペア (7〜8名)</b>:</span>
                        <span>1位 <b>各2P</b> / 2位 <b>各1P</b> / 3〜4位 0P</span>
                      </div>
                      <div className="flex justify-between">
                        <span>・<b>5ペア (9〜10名)</b>:</span>
                        <span>1位 <b>各4P</b> / 2位 <b>各2P</b> / 3位 <b>各1P</b> / 4〜5位 0P</span>
                      </div>
                    </div>
                  </div>
                  <div className="bg-amber-50/70 p-3 rounded-xl border border-amber-300">
                    <h3 className="font-bold text-amber-950 text-xs mb-1">2. 同点（タイ）時の山分けルール</h3>
                    <p className="text-[11px] text-slate-700 leading-relaxed">
                      同じチーム点数で並んだ場合、該当する順位のポイントを合算して同点チーム数で均等に山分け配当します。<br/>
                      ・<b>2ペア（4名）で1位タイ</b>: 1位(1P)＋2位(0P)＝1P ➔ <b>両チーム各 0.5P</b><br/>
                      ・<b>3〜4ペアで1位タイ</b>: 1位(2P)＋2位(1P)＝3P ➔ <b>両チーム各 1.5P</b> (3位以下0P)<br/>
                      ・<b>3〜4ペアで2位タイ</b>: 2位(1P)＋3位(0P)＝1P ➔ 1位各2P、<b>2位タイ各 0.5P</b>
                    </p>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-blue-900 text-xs mb-1">3. 全11段階タイブレーク & たすき掛け</h3>
                    <p className="text-[10px] text-slate-600">
                      前Hネット ➔ 前Hグロス ➔ 前HゲームP ➔ 前H小技数 ➔ 前Hペナ数 ➔ 累計ネット ➔ 累計グロス ➔ 累計ボナ数 ➔ 累計ペナ数 ➔ HDCP ➔ 登録順 で厳密に順位付けし、1位&最下位を組ませる<b>たすき掛け</b>で編成。前H全員完了までチームは非公開です。
                    </p>
                  </div>
                </div>
              )}

              {ruleModalTab === 4 && (
                <div className="space-y-2.5">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-amber-900 text-xs mb-1">1. 対象ホール & 基本配当</h3>
                    <p className="text-[11px]">
                      ・ニアピン: 幹事指定のPar3 (最大4ホール)<br/>
                      ・ドラコン: 幹事指定のPar5 (最大4ホール)<br/>
                      ・基本配当: <b>10P</b>（該当なし時は次回へ持ち越し / 上限20P）。
                    </p>
                  </div>
                  <div className="bg-red-50/70 p-3 rounded-xl border border-red-200">
                    <h3 className="font-bold text-red-900 text-xs mb-1">2. 累計20P上限 ＆ 完全ブロッカー</h3>
                    <p className="text-[11px]">
                      ・個人累計で<b>最大20Pまで</b>獲得可能。<br/>
                      ・すでに累計20Pに達している人が獲得した場合、付与は<b>+0P</b>となり、他人の獲得を阻止してその回のポイントを消滅させます。
                    </p>
                  </div>
                </div>
              )}

              {ruleModalTab === 5 && (
                <div className="space-y-2.5">
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-emerald-800 text-xs mb-1">1. キーボードレス直感操作</h3>
                    <p className="text-[11px]">
                      ・打数・パット数は [-] [+] ステッパーで直感調整。<br/>
                      ・チップイン/1パット/3パットはパット数から完全自動判定。
                    </p>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-200">
                    <h3 className="font-bold text-amber-900 text-xs mb-1">2. 確定と修正</h3>
                    <p className="text-[11px]">
                      ・スコア入力後は「✓ スコアを確定する」を押すとカードがグレーアウトし誤操作を防止。<br/>
                      ・修正したい場合は「✏️ 修正する」を押せばいつでも再調整可能です。
                    </p>
                  </div>
                </div>
              )}
            </div>

            <div className="p-3 bg-slate-50 border-t border-slate-200">
              <button
                onClick={() => setShowRuleModal(false)}
                className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl transition"
              >
                閉じる
              </button>
            </div>
          </div>
        </div>
      )}

    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
